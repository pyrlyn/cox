[tools]
python = "3.13.15" # runs ptools
uv = "0.12.23" # installs the pipx: ptools tool
"cargo:cargo-sweep" = "0.8.0" # `mise run sweep`: drops build artifacts unused for 1 day (ptools sweep)
mold = { version = "2.42.1", os = ["linux"] } # linker, Linux only; mise [env] below turns it on where it is installed
sccache = { version = "0.18.0", os = ["linux", "macos"] } # compiler cache; the [env] block below makes it the rustc wrapper where it is installed
"cargo:cargo-cache" = "0.8.3" # `just cache` / `just cache-autoclean`; the shared cargo home fills up
"pipx:git+https://github.com/pyrlyn/tools.git" = "d6eb6452cbb7ec4b350de87194548915c2648c27" # `mise run sweep`, `just cache`, `just swarfr` (ptools, Python; pyrlyn/tools#8, repin to a tag once merged)
rust = { version = "1.98.1", components = "rustfmt,clippy", targets = ["wasm32-unknown-unknown"] } # the one Rust version for local work, CI and releases; wasm32: the guest workspace `plugins/` (T33.27, PL§13)
node = "24.21.0" # latest LTS; runs Style Dictionary, the desktop token generator (`just desktop-tokens`, T37.17, DS§2)
zig = "0.16.0" # linker for `cargo zigbuild`: the Linux cox build the Terminal-Bench containers run (T30.9)
"aqua:rust-cross/cargo-zigbuild" = "0.23.4" # cross-builds that Linux cox from macOS without a Docker build step
"github:rust-cross/cargo-xwin" = { version = "0.23.1", os = ["macos", "linux"] } # `just windows-check` off Windows (T57.1): cargo against the MSVC CRT and SDK it fetches, no aqua entry; Windows runs cargo natively
"aqua:realm/SwiftLint" = { version = "0.65.1", os = ["macos", "linux"] } # lints desktop/macos (T37.18, DS§9); must equal the SwiftLintPlugins version the Swift packages pin; no Windows build
"aqua:linebender/resvg" = { version = "0.48.1", os = ["macos", "linux"] } # renders brand/logo/png from the SVGs (`just brand-icons`, A136); no font loading, so the bytes depend only on this pin; no Windows build
"aqua:yonaskolb/XcodeGen" = { version = "2.46.0", os = ["macos"] } # generates desktop/macos/Cox.xcodeproj from project.yml, so only the spec is in git (`just desktop-app`, T37.32.1)
"aqua:watchexec/watchexec" = "2.7.4" # `just desktop-open` rebuilds CoxFFI.xcframework on every Rust change while Xcode is open
cmake = "3.31.12" # builds whisper.cpp for cox-voice (T54.2, A123); the version sibling projects already pin
"cargo:cargo-hakari" = "0.9.39" # keeps the workspace-hack crate unified; CI runs `cargo hakari verify`

[env]
# mold as the Linux linker only where mise has installed it (clang is the driver): without mold
# the variable is empty and the default linker stays, so a Linux machine without mold or clang
# still builds. Not in .cargo/config.toml: a missing mold there would break every Linux build.
# Cargo takes these only when RUSTFLAGS is unset. macOS keeps Apple ld; Windows uses rust-lld
# through .cargo/config.toml. The probe variable stops `mise which` from recursing.
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "{% if os() == 'linux' and get_env(name='MISE_MOLD_PROBE', default='') == '' %}{{ exec(command='MISE_MOLD_PROBE=1 \"' ~ mise_bin ~ '\" which mold >/dev/null 2>&1 && echo \"-C linker=clang -C link-arg=-fuse-ld=mold\" || true') }}{% endif %}"
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "{% if os() == 'linux' and get_env(name='MISE_MOLD_PROBE', default='') == '' %}{{ exec(command='MISE_MOLD_PROBE=1 \"' ~ mise_bin ~ '\" which mold >/dev/null 2>&1 && echo \"-C linker=clang -C link-arg=-fuse-ld=mold\" || true') }}{% endif %}"
# sccache as the rustc wrapper only where mise has it installed; empty means no wrapper (CI jobs
# that install just Rust, Windows, machines without the tool). Not in .cargo/config.toml: there a
# missing sccache would break every build. The probe variable stops `mise which` from recursing
# into this same template. CI backend (R2): .github/actions/sccache, where the repo has its own jobs.
RUSTC_WRAPPER = "{% if os() != 'windows' and get_env(name='MISE_SCCACHE_PROBE', default='') == '' %}{{ exec(command='MISE_SCCACHE_PROBE=1 \"' ~ mise_bin ~ '\" which sccache 2>/dev/null || true') }}{% endif %}"
# bounded so the cache cannot fill the disk (the default is 10 GB; stated so a change is deliberate)
SCCACHE_CACHE_SIZE = "10G"
# CMake reads these two as the initial value of the same-named variable, so whisper.cpp (cox-voice)
# goes through sccache too; empty (no sccache) is the unset case, since CMake ignores an empty value.
CMAKE_C_COMPILER_LAUNCHER = "{% if os() != 'windows' and get_env(name='MISE_SCCACHE_PROBE', default='') == '' %}{{ exec(command='MISE_SCCACHE_PROBE=1 \"' ~ mise_bin ~ '\" which sccache 2>/dev/null || true') }}{% endif %}"
CMAKE_CXX_COMPILER_LAUNCHER = "{% if os() != 'windows' and get_env(name='MISE_SCCACHE_PROBE', default='') == '' %}{{ exec(command='MISE_SCCACHE_PROBE=1 \"' ~ mise_bin ~ '\" which sccache 2>/dev/null || true') }}{% endif %}"

[tasks.sweep]
description = "Remove cargo build artifacts unused for 1 day (cargo-sweep, via ptools)"
run = "ptools sweep --days 1"

[tasks.sweep-dry]
description = "Preview what sweep would remove; deletes nothing"
run = "ptools sweep --days 1 --dry-run"
