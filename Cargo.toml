[workspace]
resolver = "3"
members = ["crates/*"]
# T23.8: bare `cargo run`/`cargo build` resolve against these. The manifest is
# virtual (no `default-run`), and cox-tui's test-only `kitty_probe` bin would
# otherwise make `cargo run -- doctor` ambiguous. Test and lint commands pass
# `--workspace`, so they still build every member.
default-members = ["crates/cox"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
# GPLv3 or the royalty-free licence in LICENSE-ROYALTY-FREE.md, at the user's choice (README "License", A68).
license = "GPL-3.0-or-later OR LicenseRef-cox-Royalty-Free"
repository = "https://github.com/listepo/cox"

# Versions verified against crates.io 2026-09-02 (R§4.5). No new dependency
# without a one-line reason in the commit message and a row in plan.md §1.
[workspace.dependencies]
# cox (CLI)
clap = { version = "4.6", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
toml_edit = "0.25"
anyhow = "1.0"
# T0.7: load local .env files without overriding the process environment.
dotenvy = "0.15"

# cox-protocol
serde = { version = "1.0", features = ["derive"] }
# preserve_order: agent-client-protocol-schema requires it, which unifies the
# feature into every workspace build anyway; pinning it here makes JSON key
# order (snapshots, rollout lines, ledger JSON) identical for per-crate and
# full-workspace runs instead of depending on the invocation.
serde_json = { version = "1.0", features = ["preserve_order"] }
# Local midnight and week start for the desktop's project spend (T37.29.3.3);
# already in the tree through oauth2 and schemars.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
schemars = "1"
thiserror = "2"
ulid = { version = "3", features = ["serde"] }
tokio-util = "0.7"
# T40.1 (A81): image payloads decode and encode base64 in `cox_protocol::image`;
# also `cox-tui`'s OSC 52 clipboard write, which replaced its own encoder, and
# `cox-core`'s attached text file (T37.6).
base64 = "0.23"
# T51.7: the browser tools parse the URL they are given and pass only
# http/https (`cox-app/src/browser.rs`); T41.3: `file://` URI <-> path for
# the LSP wire (A81). 2.5.8, the latest release (2026-01-05); already in the
# tree through reqwest.
url = "2.5.8"

# cox-core
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
# D16/T13: OTLP/HTTP keeps telemetry vendor-neutral (SigNoz, Jaeger,
# Grafana/Tempo and hosted collectors) without adding a backend SDK.
# NOTE: tracing-opentelemetry 0.34 requires opentelemetry 0.33; the five crates move together. Dropped
# experimental_use_tracing_span_context (removed upstream; 0.32 attaches
# trace context by default).
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "logs"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
opentelemetry-appender-tracing = "0.33"

# cox-provider
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
eventsource-stream = "0.2.3"
tiktoken-rs = "0.12"
# T1.2: turns a reqwest byte stream into SSE frames (`sse.rs`) and drives the
# in-memory fixture parser (`parse_sse_str`) through the same code path.
bytes = "1"
futures = "0.3"
# T30.10: generates the Anthropic stream wire types from a curated JSON
# Schema (oxidecomputer, used by progenitor) instead of a hand-written Value
# walk. Build-time proc-macro only; no runtime footprint change.
typify = "0.8"
# T30.11 (A40 step 1): the OpenAI Responses request/stream-event *types*
# only (`response-types` feature, default-features off) — no HTTP client,
# no second reqwest/tokio/futures in the graph. Transport, SSE framing and
# retries stay cox's own.
async-openai = { version = "0.42", default-features = false, features = ["response-types"] }

# cox-tools
ignore = "0.4.33"
pathdiff = "0.2"
grep-searcher = "0.1.17"
# T3.3: plan.md names "grep-regex + grep-searcher sinks"; grep-regex (the
# RegexMatcher grep-searcher needs) was missing from this list.
grep-regex = "0.1.14"
globset = "0.4"
nucleo = "0.5"
similar = "3.2"
diffy = "0.5"
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
shlex = "2.0"
landlock = "0.4.7"
seccompiler = "0.5"
nix = "0.31"

# cox-mcp
rmcp = { version = "3.2", features = ["client", "server", "auth", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest"] }

# cox-store
# diesel/diesel_migrations pinned "2.2" per plan.md D9 resolve to the latest
# 2.x compatible release (2.3.x) on crates.io as of 2026-09-02; verified no
# semver-breaking API change vs. 2.2 for the sqlite backend used here.
diesel = { version = "2.2", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = "2.2"
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
directories = "6"
keyring = "4"
sha2 = "0.11"

# cox-ext
serde_yaml = "0.9"
# T22.3: hook `matcher` regexes; `regex` 1.x is already built in this tree
# (syntect/fancy-regex, tree-sitter), so this adds no new crate to the lock.
regex = "1"

# cox-tui
# T23.2: `scrolling-regions` makes the inline viewport's `insert_before`
# scroll the rows above the viewport (DECSTBM) instead of clearing and
# repainting the viewport for every finished cell; same pinned version.
ratatui = { version = "0.30.2", features = ["scrolling-regions"] }
# T5.3: plan.md says pulldown-cmark 0.10; 0.13 is the current line with the
# same Tag/TagEnd API. syntect without onig (pure-Rust fancy-regex engine).
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2"
crossterm = "0.29"
arboard = "3"
# T22.6: OSC 11 background query for `tui.theme = "auto"`.
terminal-colorsaurus = "1.0"

# cox-acp
agent-client-protocol = "2.0"

# cox-plugin
# T33.3 (A52): the WASM plugin host. Default features off: they add ureq for
# the guest `http_request` host function and URL/file module loading; cox
# loads modules from bytes only and routes plugin HTTP through its own
# grant-checked `cox_http` (PL§4, R§4.3.5 P5).
# `wasmtime-exceptions` turns on the Wasm exception-handling proposal
# (`Config::wasm_exceptions`) and nothing else; Kotlin/Wasm output needs it
# to parse (R§4.3.5 P42-P43). Approved by the creator for every plugin (A61).
extism = { version = "1.30.0", default-features = false, features = ["wasmtime-exceptions"] }
# extism 1.30.0 does not build with its default features off: it relies on
# wasmtime 43's `anyhow` feature (`wasmtime::Error` -> `anyhow::Error`), which
# only its `wasmtime-default-features` turns on, together with the whole
# wasmtime default set (component model, async, threads, ...). This enables
# that one feature by feature unification; the version follows extism's pin.
# It must stay on extism's wasmtime major: any other major resolves to a second
# wasmtime that extism never sees, and extism stops compiling (#68, 49.0.1).
wasmtime = { version = "43", default-features = false, features = ["anyhow"] }

# cox-voice
# T54.2 (A123): whisper.cpp bindings for local push-to-talk transcription.
# Only cox-voice depends on it, and cox-voice only behind `crates/cox`'s
# `voice` feature (off by default): the C++ build needs cmake (mise.toml).
whisper-rs = "0.16"
# T54.3 (A123): the default input device on every desktop OS (CoreAudio,
# ALSA, WASAPI); Linux builds need the ALSA headers (libasound2-dev).
cpal = "0.18"
# T54.3 (A123): the device rate (often 44.1/48 kHz) to whisper's 16 kHz.
rubato = "5"

# cox-i18n
# gettext localization (en default, ru, uk; docs/i18n.md). polib parses the
# embedded .po catalogs in pure Rust (no libintl, so nothing to install on
# macOS or Windows); unic-langid validates the language tags negotiation
# matches on; sys-locale reads the OS UI languages when no env var names one.
polib = "0.3"
unic-langid = "0.9"
sys-locale = "0.3"

# dev-deps
insta = { version = "1.48", features = ["json"] }
proptest = "1.11"
wiremock = "0.6"
rstest = "0.27"
assert_cmd = "2"
predicates = "3"
trycmd = "1.2.1"
assert_fs = "1"
tempfile = "3"
pretty_assertions = "1.4"
vt100 = "0.16"
portable-pty = "0.9"
async-trait = "0.1"

# Lints every member inherits through `[lints] workspace = true`. CI runs
# clippy with `-D warnings`, so `warn` here fails CI just like `deny`.
# `unsafe_code` is denied; the few places that need it (edition-2024 env
# mutation, fork/exec hooks, libproc and Landlock FFI, the uniffi glue) carry
# a targeted `allow` with a `// why:` comment.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

# `unwrap_used` and `expect_used` are left out for now: with `-D warnings`
# they would fail on the existing non-test call sites and integration-test
# helpers (which `allow-unwrap-in-tests` does not cover). Add them once those
# are converted.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

# Dev builds: debug info for our own crates only. The bulk of a debug target/
# tree is DWARF for dependencies nobody steps through; line tables still give
# file:line in backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
# Fat LTO + one codegen unit lets the linker drop cross-crate dead code (tree-
# sitter grammars, syntect, the provider matrix); strip removes symbols and
# debug info. Slower to build, which is why it is the dist profile and not
# `release`.
# `panic = "abort"` is deliberately absent: cox-mcp turns a panicking task into
# a JoinError and keeps going (fail open on extensions), which abort removes.
lto = "fat"
codegen-units = 1
strip = "symbols"
