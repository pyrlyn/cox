name: macOS signing identity
description: >-
  Import the Developer ID Application certificate into a keychain of its own,
  created for this job, so nothing is left on the runner and the login keychain
  is never touched. Exports COX_SIGN_IDENTITY (the identity's SHA-1) and
  SIGNING_KEYCHAIN to later steps. A composite action has no post step: the
  caller deletes the keychain with `security delete-keychain "$SIGNING_KEYCHAIN"`
  under `if: always() && env.SIGNING_KEYCHAIN != ''`. Shared by the CLI release
  build and the desktop app build (T37.32.3), so the import exists once.

inputs:
  certificate:
    description: The Developer ID Application .p12, base64 (secrets.MACOS_CERTIFICATE).
    required: false
    default: ''
  password:
    description: The .p12 password (secrets.MACOS_CERTIFICATE_PWD).
    required: false
    default: ''
  required:
    description: >-
      'true' fails the job when either secret is empty (a release must be signed);
      'false' warns and leaves `signed` false so the caller falls back to ad-hoc.
    required: false
    default: 'true'

outputs:
  signed:
    description: "'true' when an identity was imported."
    value: ${{ steps.import.outputs.signed }}
  identity:
    description: The Developer ID Application identity (SHA-1), empty when not signed.
    value: ${{ steps.import.outputs.identity }}

runs:
  using: composite
  steps:
    - id: import
      shell: bash
      env:
        MACOS_CERTIFICATE: ${{ inputs.certificate }}
        MACOS_CERTIFICATE_PWD: ${{ inputs.password }}
        REQUIRED: ${{ inputs.required }}
      run: |
        set -euo pipefail
        if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_CERTIFICATE_PWD" ]; then
          msg="MACOS_CERTIFICATE and MACOS_CERTIFICATE_PWD must both be set: a base64-encoded Developer ID Application .p12 and its password."
          if [ "$REQUIRED" = true ]; then
            echo "$msg" >&2
            exit 1
          fi
          echo "::warning::$msg Signing ad-hoc instead."
          echo "signed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        keychain="$RUNNER_TEMP/signing.keychain-db"
        keychain_pwd="$(openssl rand -hex 16)"
        cert="$RUNNER_TEMP/certificate.p12"
        trap 'rm -f "$cert"' EXIT
        echo "$MACOS_CERTIFICATE" | base64 --decode > "$cert"

        security create-keychain -p "$keychain_pwd" "$keychain"
        echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_pwd" "$keychain"
        security import "$cert" -P "$MACOS_CERTIFICATE_PWD" \
          -f pkcs12 -k "$keychain" -T /usr/bin/codesign
        # Without this, codesign would prompt for the key and hang the job.
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$keychain_pwd" "$keychain" >/dev/null
        security list-keychains -d user -s "$keychain" login.keychain-db

        identity="$(security find-identity -v -p codesigning "$keychain" \
          | sed -nE 's/^ *[0-9]+\) ([0-9A-F]{40}) "Developer ID Application:.*/\1/p')"
        if [ "$(printf '%s\n' "$identity" | grep -c .)" -ne 1 ]; then
          echo "expected exactly one Developer ID Application identity, found:" >&2
          security find-identity -v -p codesigning "$keychain" >&2
          exit 1
        fi
        echo "COX_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
        {
          echo "signed=true"
          echo "identity=$identity"
        } >> "$GITHUB_OUTPUT"
