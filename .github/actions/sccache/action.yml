# sccache with Cloudflare R2 as the shared cache, configured by sccache-r2 (pyrlyn/crates).
# Without the R2 secrets and variables (a fork pull request, Dependabot, a repository where
# they are not created yet) sccache-r2 turns the wrapper off and the build runs as before, so
# CI never fails because of a missing cache. A malformed endpoint or bucket name does fail.
# mise.toml sets RUSTC_WRAPPER to its own sccache wherever it installed one; this action
# overrides that for the rest of the job: R2 when configured, nothing otherwise.
# Needs the repository secrets R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY and the variables SCCACHE_BUCKET and SCCACHE_ENDPOINT.
name: sccache
description: Use sccache with a Cloudflare R2 bucket, or do nothing when it is not configured

inputs:
  access-key-id:
    description: R2 API token Access Key ID (secret R2_ACCESS_KEY_ID)
    default: ''
  secret-access-key:
    description: R2 API token Secret Access Key (secret R2_SECRET_ACCESS_KEY)
    default: ''
  bucket:
    description: R2 bucket name (variable SCCACHE_BUCKET)
    default: ''
  endpoint:
    description: https://<ACCOUNT_ID>.r2.cloudflarestorage.com (variable SCCACHE_ENDPOINT)
    default: ''
  read-only:
    description: "'true' reads the cache but never writes it (pull requests)"
    default: 'false'

runs:
  using: composite
  steps:
    - name: sccache configuration
      id: cfg
      shell: bash
      env:
        R2_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        R2_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
        SCCACHE_BUCKET: ${{ inputs.bucket }}
        SCCACHE_ENDPOINT: ${{ inputs.endpoint }}
        SCCACHE_R2_READ_ONLY: ${{ inputs.read-only }}
      run: |
        # The install must not go through a wrapper mise exported before sccache exists.
        RUSTC_WRAPPER= cargo install --locked --quiet sccache-r2@=SCCACHE_R2_VERSION
        sccache-r2 github

    - if: steps.cfg.outputs.enabled == 'true'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.18.0
