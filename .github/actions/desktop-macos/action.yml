name: desktop macOS toolchain and CoxFFI
description: >-
  Everything the macOS app builds on, for ci.yml's desktop-macos job and the
  desktop build workflow (T37.32.3), so both build the app the same way: the
  pinned Xcode 27, its Metal toolchain, the mise.toml Rust, and
  desktop/macos/build/CoxFFI.xcframework for Apple Silicon only (A67). Runs on
  the xcode-27 image.

inputs:
  # Passed by the caller because a composite action cannot read secrets; all four empty turns the
  # shared sccache action off and the build runs uncached (fork pull requests, release builds).
  sccache-access-key-id:
    description: R2 Access Key ID for the shared sccache action
    default: ''
  sccache-secret-access-key:
    description: R2 Secret Access Key for the shared sccache action
    default: ''
  sccache-bucket:
    description: R2 bucket name for the shared sccache action
    default: ''
  sccache-endpoint:
    description: R2 endpoint for the shared sccache action
    default: ''
  sccache-read-only:
    description: "'true' reads the cache but never writes it (pull requests)"
    default: 'false'

runs:
  using: composite
  steps:
    - uses: pyrlyn/ci/.github/actions/setup-xcode@main
      with:
        version: '27'

    # Since Xcode 26 the Metal toolchain is a separate component the xcode-27 image lacks:
    # SwiftTerm's Shaders.metal (CoxPlatform) fails to compile without it.
    - uses: pyrlyn/ci/.github/actions/metal-toolchain@main

    # SwiftPM clone cache, each package's .build and the app's DerivedData (see the action).
    - uses: pyrlyn/ci/.github/actions/swift-cache@main
      with:
        paths: |
          desktop/macos/Packages/*/.build
          desktop/macos/build/DerivedData
        hash-files: |
          desktop/macos/Packages/*/Package.resolved
          desktop/macos/Packages/*/Package.swift
          desktop/macos/project.yml

    # SwiftPM's clone cache, each package's .build and the app's DerivedData. The runner image is
    # fresh per job, so without this every run re-fetches SwiftTerm, swift-collections,
    # swift-snapshot-testing and the rest and rebuilds them from scratch. The key carries the
    # resolved pins and the sha: an exact hit is rare, so the newest cache for the same pins
    # (restore-keys) seeds an incremental build and the job saves a fresh one.
    - name: Swift build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
          ~/Library/org.swift.swiftpm
          desktop/macos/Packages/*/.build
          desktop/macos/build/DerivedData
        key: swift-${{ runner.os }}-${{ runner.arch }}-xcode27-${{ hashFiles('desktop/macos/Packages/*/Package.resolved', 'desktop/macos/project.yml', 'desktop/macos/Packages/*/Package.swift') }}-${{ github.sha }}
        restore-keys: |
          swift-${{ runner.os }}-${{ runner.arch }}-xcode27-${{ hashFiles('desktop/macos/Packages/*/Package.resolved', 'desktop/macos/project.yml', 'desktop/macos/Packages/*/Package.swift') }}-
          swift-${{ runner.os }}-${{ runner.arch }}-xcode27-

    - uses: pyrlyn/ci/.github/actions/setup-rust@main

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

    - uses: pyrlyn/ci/.github/actions/sccache@4593f306d517f774a96a954613d0c07fa3d23979 # ci/shared-sccache-metal, pin to main after merge (as ci.yml)
      with:
        access-key-id: ${{ inputs.sccache-access-key-id }}
        secret-access-key: ${{ inputs.sccache-secret-access-key }}
        bucket: ${{ inputs.sccache-bucket }}
        endpoint: ${{ inputs.sccache-endpoint }}
        read-only: ${{ inputs.sccache-read-only }}

    - name: CoxFFI.xcframework
      shell: bash
      run: bash scripts/desktop/xcframework.sh

    - name: arm64 only
      shell: bash
      run: |
        set -euo pipefail
        libs=$(find desktop/macos/build/CoxFFI.xcframework -name '*.a')
        [ -n "$libs" ] || { echo "no library in CoxFFI.xcframework" >&2; exit 1; }
        for lib in $libs; do
          archs=$(lipo -archs "$lib")
          echo "$lib: $archs"
          [ "$archs" = arm64 ] || { echo "expected arm64 only" >&2; exit 1; }
        done
