# Configuration for pyrlyn/ci's ci.yml, called from pipeline.yml (docs/config.md in
# pyrlyn/ci). Rust CI stays in ci.yml (infra ci-rust.yml + cox-specific jobs); this file
# turns on the scans and SonarCloud, which replaces the former sonarcloud.yml.
version: 1

# Docs-only pull requests (pyrlyn/ci docs/config.md, "Docs-only changes"): when every changed
# file is documentation, infra's scans (CodeQL, Semgrep, SonarCloud) are skipped and the gate
# counts them as passed. ci.yml's `config` job reads the same verdict: its Rust, plugin, deny,
# audit, footprint and desktop jobs become no-ops (required checks still report) and the `docs`
# job runs `just docs-check` (the tests that validate docs/) instead.
# Documentation = any *.md except Markdown that is code or test input: crates/ (prompts, agents
# and fixtures via include_str! or read by tests), plugins/ (shipped packages), fixtures/,
# desktop/ (lint fixtures, design), evals/, examples/, scripts/ and tests/; README.md and
# CHANGELOG.md (release) through pyrlyn/ci's default `base-exclude`. Anything else (.github/,
# mise.toml, a non-.md file) runs the full CI.
docs-only:
  enabled: true
  exclude:
    - '^(crates|plugins|fixtures|desktop|evals|examples|scripts|tests)/'

codeql:
  # Every language in the repository that supports `build-mode: none`.
  languages: [actions, javascript-typescript, python, rust]

sonarcloud:
  enabled: true # push, pull_request and workflow_dispatch (pyrlyn/ci's default events)
  rust: true # llvm-tools-preview, cargo-llvm-cov
  mise-install-args: rust
  setup-command: bash .github/actions/voice/install.sh # cox-voice build packages
  coverage-command: cargo llvm-cov --workspace --locked --lcov --output-path coverage/lcov.info

# License files against pyrlyn/ci's canonical ones (replaces license-check.yml).
license:
  enabled: true

# Snyk stays off (pyrlyn/ci's default; SNYK_TOKEN stays).

# actionlint stays off for now: the hand-written release.yml has shellcheck findings and
# ci.yml has a constant `if: false` job. Turn on once those are fixed.
lint:
  enabled: false
