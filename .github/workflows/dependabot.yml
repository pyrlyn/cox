# Dependabot pull requests: merge patch-level updates once this commit's ci.yml run (the
# repository's full CI, started by the pull request itself) is green. The CI is not run a
# second time here. pyrlyn/ci's dependabot-automerge.yml:
# - waits for ci.yml on the head commit and refuses unless its latest run succeeded;
# - squash-merges `version-update:semver-patch` pinned to that commit (never --auto, never
#   --admin); minor and major updates get the `needs-review` label;
# - assigns and mentions @listepo on a major update (with a review request) and when the
#   merge job fails.
# Inputs: https://github.com/pyrlyn/ci/blob/main/docs/reusable-workflows.md
name: Dependabot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: dependabot-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    # Dependabot's own pull requests only, from a branch of this repository.
    if: >-
      github.actor == 'dependabot[bot]'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: pyrlyn/ci/.github/workflows/dependabot-automerge.yml@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main
    permissions:
      contents: write
      pull-requests: write
      actions: read
    with:
      ci-result: success # the real gate is wait-workflow
      wait-workflow: ci.yml
