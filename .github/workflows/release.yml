name: release

# The one release workflow, and its one trigger. It never tags a normal release: bump.yml
# (Actions -> Bump and release, pyrlyn/ci bump.yml) is the only way to one. bump runs
# `scripts/release.sh --local`, opens a pull request with the version commit, rebase-merges it
# once every required check is green, tags the commit that landed on main, creates a *draft*
# release with the CHANGELOG.md section for the version, and dispatches this workflow with
# `--ref <tag> -f tag=<tag>`. A tag or release made with GITHUB_TOKEN starts no workflow, so
# the dispatch is explicit.
#
# Here: verify (fmt, clippy, nextest — the same gate as CI) on the tagged commit, then the two
# build workflows on it: build-cli.yml (all three targets through `scripts/package.sh`, smoke
# tested) and desktop-build.yml (the macOS app's DMG), both signed through
# .github/actions/macos-signing. Everything goes up to bump's draft, which is published last,
# then the cask. A failed build leaves the tag and a draft (not on /releases/latest, so
# `install.sh` and `cox self update` never see it); re-run this workflow with the same tag to
# finish it.
#
# Test releases: a `vX.Y.Z-test.N` tag (X.Y.Z = Cargo.toml's version), made by hand on the
# commit to try and dispatched the same way
# (`gh workflow run release.yml --ref vX.Y.Z-test.N -f tag=vX.Y.Z-test.N`). Same gate, same
# builds and signing, but no bump: no version or CHANGELOG commit on main. This workflow
# creates the release itself as a *prerelease* that is never marked latest, so
# /releases/latest (install.sh, `cox self update`) and the Homebrew cask (skipped) stay on the
# last normal release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag: bump.yml's vX.Y.Z, or a vX.Y.Z-test.N test tag; run with --ref <tag>"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# One release at a time; cancelling a run halfway could leave a half-uploaded
# draft behind.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The cheap job that checks this run is on the tag bump.yml created, before
  # anything is built.
  #
  # The version in `Cargo.toml` *is* the tag: `cox self update` compares the
  # running binary's version against the release tag, so deriving one from the
  # other is what keeps them from disagreeing. It also means "already tagged"
  # is the same statement as "already released".
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      publish: ${{ steps.decide.outputs.publish }}
      ref: ${{ steps.decide.outputs.ref }}
      test: ${{ steps.decide.outputs.test }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Is this the tag bump created?
        id: decide
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          [ -n "$version" ] || { echo "could not read the version out of Cargo.toml" >&2; exit 1; }
          # A test tag is v<version>-test.<n>: same version, never a bump.
          if [[ "$TAG" =~ ^v${version//./\\.}-test\.[0-9]+$ ]]; then
            tag="$TAG"
            test=true
          else
            tag="v$version"
            test=false
          fi
          if [ "$TAG" != "$tag" ]; then
            echo "tag input $TAG is not v<Cargo.toml version> ($tag) or $tag-test.<n> at $GITHUB_SHA" >&2
            exit 1
          fi
          # bump.yml tags the commit that landed on main; this run must be on it.
          # An annotated tag's commit is its peeled `refs/tags/<tag>^{}` line (ls-remote
          # never prints `^{commit}`, so that lookup always fell through to the tag object);
          # a lightweight tag only has the plain refs/tags/<tag> line.
          ref="$(git ls-remote origin "refs/tags/${tag}^{}" | awk '{print $1; exit}')"
          if [ -z "$ref" ]; then
            ref="$(git ls-remote origin "refs/tags/${tag}" | awk '{print $1; exit}')"
          fi
          [ -n "$ref" ] || { echo "$tag does not exist; release with Bump and release" >&2; exit 1; }
          if [ "$ref" != "$GITHUB_SHA" ]; then
            echo "$tag is $ref, this run is on $GITHUB_SHA; dispatch with --ref $tag" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "ref=$ref"
            echo "publish=true"
            echo "test=$test"
          } >> "$GITHUB_OUTPUT"
          echo "$tag at $ref: releasing it"

  # Nothing is published unless the same gate CI applies is green. A release is
  # the one build people cannot re-run themselves.
  verify:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: pyrlyn/ci/.github/actions/setup-xcode@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main
        with:
          version: '27'
      # The Rust mise.toml pins, checked like in ci.yml. `cox-plugin-fixtures`
      # builds the example plugin for wasm32 (PL§13, T33.28); the target comes
      # with the pin.
      - uses: pyrlyn/ci/.github/actions/setup-rust@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo nextest run --workspace --locked

  # The CLI archives (build-cli.yml) and the macOS app's DMG (desktop-build.yml), both from
  # the tagged commit, both signed through .github/actions/macos-signing with the same two
  # secrets: one signing setup for everything the release ships.
  cli:
    needs: [version, verify]
    uses: ./.github/workflows/build-cli.yml
    with:
      ref: ${{ needs.version.outputs.ref }}
      require-signing: true
    secrets:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      APPSTORE_CONNECT_KEY: ${{ secrets.APPSTORE_CONNECT_KEY }}
      APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
      APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}

  # The macOS app's DMG (T37.32.3), published with the CLI archives. It must be Developer
  # ID-signed, as the CLI must.
  desktop:
    needs: [version, verify]
    uses: ./.github/workflows/desktop-build.yml
    with:
      ref: ${{ needs.version.outputs.ref }}
      require-signing: true
    secrets:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}

  publish:
    needs: [version, cli, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: staging
      - name: Collect assets and checksums
        run: |
          mkdir -p dist
          find staging \( -name '*.tar.xz' -o -name '*.dmg' \) -exec mv {} dist/ \;
          cd dist
          # One aggregate file. Sorted, so the file is reproducible.
          shasum -a 256 $(ls *.tar.xz *.dmg | sort) > SHA256SUMS
          cat SHA256SUMS
          # Per-archive sidecars: install.sh and `cox self update` fetch
          # `<archive>.sha256` next to each tarball.
          for f in *.tar.xz *.dmg; do
            shasum -a 256 "$f" > "$f.sha256"
          done
      # bump.yml made the tag and the draft release (notes from CHANGELOG.md).
      # Everything goes up to that draft, and publishing it is the last step,
      # so an interrupted run leaves a draft to re-run, never a half release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          TEST: ${{ needs.version.outputs.test }}
        run: |
          set -euo pipefail
          if [ "$TEST" = true ]; then
            # No bump for a test tag, so no draft yet: make one, a prerelease never marked latest.
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" --verify-tag --draft --prerelease --latest=false \
                --title "$TAG (test build)" \
                --notes "Test build of $(git rev-parse --short HEAD), not a release: same gate, builds and signing as a release, published as a prerelease that is never /releases/latest. The macOS app is a Debug build, Developer ID-signed, not notarised."
            fi
          elif ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "no release for $TAG: Bump and release creates it" >&2
            exit 1
          fi
          gh release upload "$TAG" dist/* --clobber
          if [ "$TEST" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
            latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
            if [ "$latest" = "$TAG" ]; then
              echo "test release $TAG became /releases/latest" >&2
              exit 1
            fi
          else
            gh release edit "$TAG" --draft=false
          fi
          gh release view "$TAG" --json tagName,isDraft,assets \
            --jq '"published \(.tagName) draft=\(.isDraft) assets=\(.assets | length)"'

  # The Homebrew cask in pyrlyn/homebrew-tap is generated from this release:
  # version and both checksums. It runs after publish so `brew install` never
  # names a tarball that is not on the releases page yet.
  tap:
    needs: [version, publish]
    # Test releases never reach the cask.
    if: needs.version.outputs.test != 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      # From the published release, not this run's build artifacts: a tap
      # failure can then be re-run without rebuilding (and re-uploading)
      # binaries the tag already describes.
      - name: Fetch release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --pattern 'cox-*-apple-darwin.tar.xz' --dir dist
          ls -l dist
      - name: Generate the cask
        env:
          # A token that can push to pyrlyn/homebrew-tap. The default
          # GITHUB_TOKEN is scoped to this repository, so it cannot.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: pyrlyn/homebrew-tap
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; the cask in $TAP_REPO was not updated" >&2
            exit 1
          fi
          # Checksums come from the published tag; the version advertised in
          # the cask must be that tag's, not HEAD's Cargo.toml if they differ.
          release_tag="$(gh release view "$TAG" --json tagName --jq .tagName)"
          release_version="${release_tag#v}"
          if [ "$release_version" != "$VERSION" ]; then
            echo "cask version $release_version from $TAG does not match workflow version $VERSION" >&2
            exit 1
          fi
          arm="$(shasum -a 256 dist/cox-aarch64-apple-darwin.tar.xz | cut -d' ' -f1)"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Casks
          scripts/cask.sh "$release_version" "$arm" > tap/Casks/cox.rb
      - name: Lint the cask
        run: brew style tap/Casks/cox.rb
      # Commit before smoking: `brew tap … $PWD/tap` uses the git HEAD of a
      # path tap, so an uncommitted Casks/cox.rb would still install the
      # previous release and leave the new checksums untested.
      - name: Commit the cask
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd tap
          git rev-parse --verify HEAD >/dev/null 2>&1 || git checkout -q -B main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/cox.rb
          if git diff --cached --quiet; then
            echo "cask already at $VERSION"
          else
            git commit -m "cox $VERSION"
          fi
      # brew style only checks syntax; install steps run for real only under
      # `brew install`. Smoke the file about to be pushed so a broken cask
      # never reaches the tap.
      - name: Smoke test the cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Homebrew 4.6+ rejects bare cask paths; install via a local tap of the
          # clone we are about to push (pyrlyn/homebrew-tap → pyrlyn/tap).
          # Drop a prior tap first: otherwise `brew tap name path` can leave the
          # remote clone in place and smoke the published cask instead of
          # the one Generate just wrote for this tag.
          brew untap pyrlyn/tap >/dev/null 2>&1 || true
          brew tap pyrlyn/tap "$PWD/tap"
          # Guard: the cask under this tap must advertise the version we published.
          cask_version="$(brew info --cask --json=v2 pyrlyn/tap/cox | python3 -c 'import json,sys; print(json.load(sys.stdin)["casks"][0]["version"])')"
          if [ "$cask_version" != "${{ needs.version.outputs.version }}" ]; then
            echo "smoke would install cask $cask_version, expected ${{ needs.version.outputs.version }}" >&2
            echo "---- tap/Casks/cox.rb ----" >&2
            cat tap/Casks/cox.rb >&2
            exit 1
          fi
          brew install --cask --verbose pyrlyn/tap/cox
          brew uninstall --cask cox
      - name: Push the cask
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd tap
          # Commit happened before smoke; push whatever HEAD is (may already
          # match the remote if this tag was re-run).
          if git rev-parse --verify @{u} >/dev/null 2>&1; then
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse @{u})" ]; then
              echo "cask already at $VERSION on the remote"
              exit 0
            fi
          fi
          git push origin HEAD

  # A failed release opens or comments on a `release-failure` issue that mentions and assigns
  # @listepo (pyrlyn/ci notify-release-failure): GitHub cannot filter Actions notifications
  # per workflow, so this is the release failure notification. Pinned to pyrlyn/ci
  # ci/notify-release-failure; repin to its merge commit.
  notify-failure:
    needs: [version, verify, cli, desktop, publish, tap]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # failed job names
      issues: write
    steps:
      - uses: pyrlyn/ci/.github/actions/notify-release-failure@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main
        with:
          ref: ${{ needs.version.outputs.tag || github.ref_name }}
          needs: ${{ toJSON(needs) }}
