name: CI

on:
  pull_request:
    branches: [main]
    # Draft PRs run no CI: every job below is skipped on a draft, and marking the PR
    # ready for review (`ready_for_review`) runs the full set.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Build and test jobs need only to read the repository; a job that needs more declares its own.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every job installs Rust from mise.toml, the single source of the Rust
# version: the `rust` job through the shared pyrlyn/ci workflow, the others
# through pyrlyn/ci's setup-rust action. Both fail when rustc is not that pin.
jobs:
  # Which runner the macOS jobs use: pyrlyn/ci's macos-runner action reads the MACOS_RUNNER
  # variable (unset or `hosted` = the hosted label, `xcode-27-local` = the dedicated Mac;
  # fork PRs keep the hosted label).
  macos-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.r.outputs.value }}
    steps:
      - id: r
        uses: pyrlyn/ci/.github/actions/macos-runner@main
        with:
          runner: ${{ vars.MACOS_RUNNER }}
          value: '["xcode-27"]'

  # infra's config action on .github/infra.yml: `docs-only` is "true" when every changed file
  # is documentation (fails open: "false" when unsure, e.g. a .github/ change). The jobs below
  # then do no work but still report under their names, so the required checks pass, and
  # `docs` runs the tests that read docs/. A failed `config` runs everything.
  config:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.config.outputs.docs-only }}
    steps:
      - id: config
        uses: pyrlyn/ci/.github/actions/config@main

  # The shared pyrlyn/ci workflow: fmt once, then per Linux target (x86_64 and
  # aarch64) clippy (--all-targets --all-features), check, and the full nextest
  # suite. Linux only (docs/ci-platforms.md): the tests gated to macOS run in the
  # optional `macos` job below.
  rust:
    needs: config
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    uses: pyrlyn/ci/.github/workflows/ci-rust.yml@main
    # ci-rust cancels the whole run when a job fails (cancel-run-on-failure), which needs
    # `actions: write` on the calling job.
    permissions:
      contents: read
      actions: write
    with:
      mold: true # mold + clang on Linux runners (mise.toml [env])
      # Linux only. Windows: the workspace does not build there yet (P57); the
      # `windows` job below checks the crates that do. macOS: the `macos` job.
      matrix: >-
        [
        {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu"},
        {"os": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-gnu"}
        ]
      # The manifest is virtual with `default-members`; ci-rust's default `package-args`
      # (--workspace) already covers every member, so no `clippy-args` here.
      tools: nextest
      # Linux job A (plan.md T4.2): the sandbox must pick bubblewrap; job B
      # (sandbox-landlock) covers the Landlock fallback. cox-voice's build
      # packages (T54.2) for `--workspace` and `--all-features`.
      setup-command: |
        if [ "$RUNNER_OS" = Linux ]; then bash .github/actions/bwrap/install.sh; fi
        bash .github/actions/voice/install.sh
      # Same features as build-command and clippy, so nextest reuses the build's artifacts
      # instead of compiling the default feature set a second time.
      test-command: cargo nextest run --workspace --all-features
      build-command: cargo build --workspace --all-targets --all-features --target "$TARGET"
      # CI runs only on pull requests, so the default-branch-only cache would
      # never be written.
      cache-all-refs: true
      # Docs-only: every job is a no-op that still reports (`rust / <target>` stay required).
      skip: ${{ needs.config.outputs.docs-only == 'true' }}

  # Only the Rust tests gated to macOS (cfg(target_os = "macos"): the Seatbelt sandbox and
  # what runs under it); everything else runs on Linux in `rust` (docs/ci-platforms.md).
  # Optional: continue-on-error, so it never blocks a merge. PLATFORM_TESTS lists them by
  # name; keep it in sync when such a test is added or renamed. `--no-tests=pass` keeps an
  # empty selection green.
  macos:
    needs: [config, macos-runner]
    if: >-
      vars.MACOS_CI_DISABLED != 'true' &&
      !cancelled() && needs.config.outputs.docs-only != 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    continue-on-error: true
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.macos-runner.outputs.value)[0] || 'xcode-27' }}
    timeout-minutes: 45
    env:
      PLATFORM_TESTS: >-
        test(/(^|::)argv_wraps_an_interactive_login_shell_in_seatbelt$/) | test(/(^|::)sandbox_macos_backend_is_seatbelt_and_wraps_the_shell$/) | test(/(^|::)sandbox_macos_blocks_the_network_unless_allowed$/) | test(/(^|::)sandbox_macos_denies_writes_outside_the_root$/) | test(/(^|::)sandbox_macos_keeps_git_read_only_inside_the_root$/) | test(/(^|::)sandbox_macos_read_only_denies_writes_inside_the_root$/) | test(/(^|::)sandbox_macos_workspace_write_allows_writes_inside_the_root$/) | test(/(^|::)terminal_output_is_not_in_the_rollout$/) | test(/(^|::)terminal_write_outside_the_workspace_is_denied_under_workspace_write$/)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pyrlyn/ci/.github/actions/setup-xcode@main
        with:
          version: '27'

      - uses: pyrlyn/ci/.github/actions/setup-rust@main

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: taiki-e/install-action@23d41aa71228a2692ee31bb433f070fd4bdc6661 # nextest

      # Same features as the `rust` job.
      - name: tests skipped (SKIP_CI_TESTS)
        if: vars.SKIP_CI_TESTS == 'true' || env.SKIP_CI_TESTS == 'true'
        run: echo "::notice title=SKIP_CI_TESTS::tests skipped by SKIP_CI_TESTS"
      - if: vars.SKIP_CI_TESTS != 'true' && env.SKIP_CI_TESTS != 'true'
        name: platform tests
        run: cargo nextest run --workspace --all-features --no-tests=pass -E "$PLATFORM_TESTS"

  # Linux job B (plan.md T4.2): no bwrap on PATH, so the sandbox must fall
  # back to Landlock + seccomp and still hold the same guarantees.
  sandbox-landlock:
    needs: config
    if: >-
      !cancelled() && needs.config.outputs.docs-only != 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    env:
      COX_EXPECT_SANDBOX: landlock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pyrlyn/ci/.github/actions/setup-rust@main

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: pyrlyn/ci/.github/actions/sccache@main
        with:
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          read-only: ${{ github.event_name == 'pull_request' }}

      - name: no bubblewrap
        run: |
          sudo apt-get remove -y bubblewrap || true
          if command -v bwrap; then echo "bwrap still on PATH" && exit 1; fi

      - uses: taiki-e/install-action@23d41aa71228a2692ee31bb433f070fd4bdc6661 # nextest

      - name: tests skipped (SKIP_CI_TESTS)
        if: vars.SKIP_CI_TESTS == 'true' || env.SKIP_CI_TESTS == 'true'
        run: echo "::notice title=SKIP_CI_TESTS::tests skipped by SKIP_CI_TESTS"
      - if: vars.SKIP_CI_TESTS != 'true' && env.SKIP_CI_TESTS != 'true'
        name: sandbox tests without bwrap
        run: |
          cargo nextest run -p cox-tools sandbox_ bash_ bash::

  # P57 (T57.1): `cargo check` and clippy for x64 and ARM64 Windows over the
  # crates that build there, listed once in the justfile (`windows_crates`);
  # each P57 card adds its crates. It is
  # required for a merge only once T57.11 builds the whole workspace.
  # Off until the Windows work is built and tested on a Windows host (creator,
  # 2026-09-29); CI comes after that.
  windows:
    if: false
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pyrlyn/ci/.github/actions/setup-rust@main

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: taiki-e/install-action@b6a061addd82b81aaeca51bdf2c53cd707996e5a # just

      - name: windows check
        run: just windows-check

  # The Windows app (T58.3). `global.json` pins the .NET 10 SDK and the
  # Microsoft.Testing.Platform runner, so the steps run in `desktop/windows`.
  # Enabled after the layout built and its MSTest passed on a Windows host (A130).
  desktop-windows:
    needs: [config, changes]
    if: >-
      !cancelled() && needs.config.outputs.docs-only != 'true'
      && (needs.changes.result != 'success'
      || needs.changes.outputs.swift == 'true')
    # Platform-only (docs/ci-platforms.md): optional, never blocks a merge.
    continue-on-error: true
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: desktop/windows/global.json

      - name: build
        run: dotnet build Cox.sln -c Debug

      - name: tests skipped (SKIP_CI_TESTS)
        if: vars.SKIP_CI_TESTS == 'true' || env.SKIP_CI_TESTS == 'true'
        run: echo "::notice title=SKIP_CI_TESTS::tests skipped by SKIP_CI_TESTS"
      - if: vars.SKIP_CI_TESTS != 'true' && env.SKIP_CI_TESTS != 'true'
        name: test
        run: dotnet test --project Cox.Tests -c Debug

  # The guest workspace (plugins/, PL§9, T33.40.2): its own `cargo test`
  # target (a separate workspace, so the root `rust` job above never builds
  # it) plus the wasm32-unknown-unknown build every plugin ships as.
  plugins:
    needs: config
    if: >-
      !cancelled() && needs.config.outputs.docs-only != 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # wasm32-unknown-unknown comes with the mise.toml pin.
      - uses: pyrlyn/ci/.github/actions/setup-rust@main

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: pyrlyn/ci/.github/actions/sccache@main
        with:
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          read-only: ${{ github.event_name == 'pull_request' }}

      - name: tests skipped (SKIP_CI_TESTS)
        if: vars.SKIP_CI_TESTS == 'true' || env.SKIP_CI_TESTS == 'true'
        run: echo "::notice title=SKIP_CI_TESTS::tests skipped by SKIP_CI_TESTS"
      - if: vars.SKIP_CI_TESTS != 'true' && env.SKIP_CI_TESTS != 'true'
        name: plugin tests
        run: cargo test --manifest-path plugins/Cargo.toml --workspace

      - name: plugin wasm32 build
        run: cargo build --manifest-path plugins/Cargo.toml --workspace --target wasm32-unknown-unknown

  # Guest-language examples that need a toolchain of their own (PL§13):
  # each is `#[ignore]`d in the main `rust` job with a reason naming
  # `just plugin-examples <lang>`, so a missing toolchain here is a CI
  # failure rather than a silently skipped test: Dart (T33.38), Go (T33.34)
  # and Kotlin (T33.36).
  plugin-examples:
    needs: config
    if: >-
      !cancelled() && needs.config.outputs.docs-only != 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `cox`'s tests build cox-plugin-fixtures, whose build.rs compiles the
      # guest workspace for wasm32 (T33.28); the target comes with the pin.
      - uses: pyrlyn/ci/.github/actions/setup-rust@main

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Go, TinyGo, Java and Gradle at the versions plugins/mise.toml pins.
      # Before the sccache step, which sets RUSTC_WRAPPER after mise's [env]
      # does. No shims: the template tests run `go` and `gradle` from a
      # scratch dir, where a shim finds no config; the real bin dirs go on
      # PATH instead.
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          working_directory: plugins
          install_args: go tinygo java gradle
          add_shims_to_path: false

      # mise 2026.10 no longer resolves a tool from `plugins/mise.toml` when
      # a template test runs `tinygo` from a temp dir ("No version is set
      # for shim"); the Kotlin template test likewise runs `gradle` from a temp
      # dir. Pin the same versions globally so any cwd resolves them.
      - name: pin Go, TinyGo, Java and Gradle globally
        run: mise use -g go@1.27.2 tinygo@0.43.0 java@27.0.0 gradle@9.8.0

      - uses: pyrlyn/ci/.github/actions/sccache@main
        with:
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          read-only: ${{ github.event_name == 'pull_request' }}

      - uses: taiki-e/install-action@23d41aa71228a2692ee31bb433f070fd4bdc6661 # nextest

      # The example's `[[mcp]]` server runs under `sandboxed_argv`, which on
      # Linux needs bwrap: Landlock cannot wrap an argv.
      - name: bubblewrap
        uses: ./.github/actions/bwrap

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.4"

      - name: build the Dart example
        run: |
          cd plugins/examples/dart
          dart pub get
          mkdir -p build
          dart compile exe bin/server.dart -o build/example_dart

      - name: tests skipped (SKIP_CI_TESTS)
        if: vars.SKIP_CI_TESTS == 'true' || env.SKIP_CI_TESTS == 'true'
        run: echo "::notice title=SKIP_CI_TESTS::tests skipped by SKIP_CI_TESTS"
      - if: vars.SKIP_CI_TESTS != 'true' && env.SKIP_CI_TESTS != 'true'
        name: dart plugin example e2e
        run: cargo nextest run -p cox --run-ignored only -E 'test(plugin_example_dart)'

      - name: build the Go example
        run: |
          (cd plugins/sdk-go && go test ./... && tinygo test .)
          cd plugins/examples/go
          go test ./...
          tinygo build -o example_go.wasm -target wasip1 -buildmode=c-shared .

      # Also scaffolds `cox plugin new --lang go` and builds it with TinyGo.
      # The setup-rust step's mise shims still come first on PATH, and the
      # `tinygo` shim fails in the template test's scratch dir (no pin
      # there); hand the test the plugins' real tool PATH, as
      # `just plugin-examples go` does.
      - if: vars.SKIP_CI_TESTS != 'true' && env.SKIP_CI_TESTS != 'true'
        name: go plugin example e2e
        run: |
          PLUGIN_TOOLS_PATH="$(cd plugins && eval "$(mise env -s bash)" && printf '%s' "$PATH")"
          export PLUGIN_TOOLS_PATH
          cargo nextest run -p cox --run-ignored only -E 'test(plugin_example_go)'

      # Stages plugin.toml and example_kotlin.wasm in build/plugin. No
      # daemon, so the job leaves no Gradle process running.
      - name: build the Kotlin example
        run: |
          cd plugins/examples/kotlin
          gradle --no-daemon -q pluginPackage

      # Also scaffolds `cox plugin new --lang kotlin` and builds it with
      # Gradle, which needs the same real PATH as the Go template test.
      - if: vars.SKIP_CI_TESTS != 'true' && env.SKIP_CI_TESTS != 'true'
        name: kotlin plugin example e2e
        run: |
          PLUGIN_TOOLS_PATH="$(cd plugins && eval "$(mise env -s bash)" && printf '%s' "$PATH")"
          export PLUGIN_TOOLS_PATH
          cargo nextest run -p cox --run-ignored only -E 'test(plugin_example_kotlin)'

  deny:
    needs: config
    if: >-
      !cancelled() && needs.config.outputs.docs-only != 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Fails when workspace-hack drifts from the dependency graph. cargo-hakari comes from
  # mise.toml (only it, rust and sccache are installed here: mise refuses a `cargo:` tool
  # while a configured sccache is missing). Own job, so the required checks keep their names.
  hakari:
    needs: config
    if: >-
      !cancelled() && needs.config.outputs.docs-only != 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: rust sccache cargo:cargo-hakari
      - run: cargo hakari generate --diff
      - run: cargo hakari manage-deps --dry-run
      - run: cargo hakari verify

  audit:
    needs: config
    if: >-
      !cancelled() && needs.config.outputs.docs-only != 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pyrlyn/ci/.github/actions/setup-rust@main
      # cargo-audit does not read deny.toml, so its `[advisories] ignore` list
      # (each entry with its reason and review date) is passed as --ignore
      # flags: one list, one place to remove an entry.
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          ignores=$(python3 -c 'import tomllib; print(" ".join("--ignore " + (i if isinstance(i, str) else i["id"]) for i in tomllib.load(open("deny.toml", "rb"))["advisories"]["ignore"]))')
          # shellcheck disable=SC2086 # word splitting into flags is intended
          cargo audit $ignores

  # plan.md T30.2: `bash scripts/footprint.sh --check` fails when any metric
  # regresses more than 20% against scripts/footprint.json (keyed by
  # OS-arch plus `-ci`, so each runner compares against a baseline measured on
  # a runner, never against a laptop's; T30.4).
  # One job per runner with a static name, not a matrix: a docs-only change skips both at job
  # level (no runner starts, no macOS for `footprint (xcode-27)`), and a skipped job with a
  # static name still reports under that name, so the required `footprint (<os>)` checks pass.
  # A skipped matrix job would report one check under its raw name and leave them waiting.
  footprint-macos:
    name: footprint (xcode-27)
    needs: [config, macos-runner]
    if: >-
      vars.MACOS_CI_DISABLED != 'true' &&
      !cancelled() && needs.config.outputs.docs-only != 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    # Platform-only (docs/ci-platforms.md): optional, never blocks a merge.
    continue-on-error: true
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.macos-runner.outputs.value)[0] || 'xcode-27' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pyrlyn/ci/.github/actions/setup-rust@main

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: footprint regression check
        run: bash scripts/footprint.sh --check

  footprint-linux:
    name: footprint (ubuntu-24.04)
    needs: config
    if: >-
      !cancelled() && needs.config.outputs.docs-only != 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pyrlyn/ci/.github/actions/setup-rust@main

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: footprint regression check
        run: bash scripts/footprint.sh --check

  # Which suites this change needs, from the shared pyrlyn/ci classification
  # (changes.yml): per ecosystem, whether anything changed and whether a
  # dependency manifest or lock changed (`*_deps`, which forces that full suite).
  # `desktop-macos`, `desktop-macos-lint` and `desktop-windows` read it. The Rust jobs above always run in full on
  # every pull request (the `docs` test reads docs/, so no path filter is safe
  # there), which already covers any Cargo.toml or Cargo.lock change.
  # The Swift suite counts desktop/ and scripts/desktop/ as Swift, and the app
  # links CoxFFI.xcframework, so a Rust change (crates/, Cargo manifests or
  # lock) runs it too. `desktop-windows` reads the same `swift` output, because
  # `^desktop/` includes `desktop/windows/`. A failed `changes` job runs these
  # jobs rather than skipping them. A skipped job reports `skipped` under its
  # own name, which a required check treats as passed.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: pyrlyn/ci/.github/workflows/changes.yml@main
    permissions:
      contents: read
    with:
      rust-paths: |
        ^crates/
      swift-paths: |
        ^desktop/
        ^scripts/desktop/
        ^brand/logo/
        ^scripts/brand_icons

  # SwiftLint's no-literal rules and swift-format for the macOS app (T37.18,
  # DS§9). The fixtures prove the custom rules still reject what DS§9 bans; the
  # packages are linted by the SwiftLintPlugins build-tool plugin during
  # desktop-macos' `swift test`. SwiftLint is the mise.toml pin.
  desktop-macos-lint:
    needs: [config, changes, macos-runner]
    if: >-
      vars.MACOS_CI_DISABLED != 'true' &&
      !cancelled() && needs.config.outputs.docs-only != 'true'
      && (needs.changes.result != 'success' || needs.changes.outputs.swift == 'true')
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    # Platform-only (docs/ci-platforms.md): optional, never blocks a merge.
    continue-on-error: true
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.macos-runner.outputs.value)[0] || 'xcode-27' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pyrlyn/ci/.github/actions/setup-xcode@main
        with:
          version: '27'

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: aqua:realm/SwiftLint aqua:linebender/resvg

      # The icons and logo rasters scripts/brand_icons.py derives from brand/logo/*.svg. Here,
      # not on Linux: resvg's PNG bytes are only stable on one architecture, and Apple Silicon
      # is where they are generated.
      - name: brand icons match brand/logo
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_brand_icons.py'
          python3 scripts/brand_icons.py --check

      - name: swiftlint fixtures
        working-directory: desktop/macos
        run: |
          set -euo pipefail
          find LintFixtures/Accepted -name '*.swift' -print0 \
            | xargs -0 swiftlint lint --strict --no-cache --quiet
          for fixture in LintFixtures/Rejected/*.swift; do
            rule=$(basename "$fixture" .swift)
            if out=$(swiftlint lint --no-cache --quiet "$fixture"); then
              echo "$fixture: passed, expected $rule to fail it" >&2
              exit 1
            fi
            if ! grep -q "($rule)\$" <<<"$out"; then
              echo "$fixture: failed without a $rule violation:" >&2
              echo "$out" >&2
              exit 1
            fi
          done

      # The app target is in no package, so no build-tool plugin lints it (T37.32.1).
      - name: swiftlint app
        working-directory: desktop/macos
        run: swiftlint lint --strict --no-cache --quiet App

      # The UI-free packages are linted here too, not only by the build-tool plugin, so the
      # rules still gate a pull request if a build stops running the plugin (T63.3, DT§4.6).
      - name: swiftlint UI-free packages
        working-directory: desktop/macos
        run: swiftlint lint --strict --no-cache --quiet Packages/CoxModel/Sources Packages/CoxCore/Sources

      - name: swift-format
        run: |
          set -euo pipefail
          dirs=(desktop/macos/LintFixtures desktop/macos/App)
          if [ -d desktop/macos/Packages ]; then dirs+=(desktop/macos/Packages); fi
          xcrun swift-format lint --strict --recursive "${dirs[@]}"

  # The macOS app (T37.15, DT§7): CoxFFI.xcframework for Apple Silicon only
  # (A67), then `swift test` for every package under desktop/macos/Packages,
  # then the app target, unsigned (T37.32.1). xcode-27 is GitHub's arm64 image
  # with Xcode 27 (macos-26 / macos-latest carry Xcode 26.x); setup-xcode selects
  # the pinned stable Xcode 27 and fails when the image has none. The full build on
  # main and manual runs: every package and the app. On a pull request a package
  # whose inputs (its sources, tests, snapshots, local dependencies, the files its
  # tests read, the toolchain) are byte-identical to a run that passed, on main or
  # earlier on the pull request, is not tested again (T63.2, A141): pass markers
  # in actions/cache, scripts/desktop/swift_test.sh. The app target is built on
  # every run. The toolchain and XCFramework steps are
  # .github/actions/desktop-macos, shared with the desktop build workflow
  # (T37.32.3).
  desktop-macos:
    needs: [config, changes, macos-runner]
    if: >-
      vars.MACOS_CI_DISABLED != 'true' &&
      !cancelled() && needs.config.outputs.docs-only != 'true'
      && (needs.changes.result != 'success'
      || needs.changes.outputs.swift == 'true' || needs.changes.outputs.rust == 'true')
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    # Platform-only (docs/ci-platforms.md): optional, never blocks a merge.
    continue-on-error: true
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.macos-runner.outputs.value)[0] || 'xcode-27' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/desktop-macos
        with:
          sccache-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-read-only: ${{ github.event_name == 'pull_request' }}
          ffi-cache: 'true'

      # Snapshots are per toolchain (desktop/macos/Packages/*/Tests/*/Snapshots/<key>). The hosted
      # images' real key is not known yet, so the committed images sit under `hosted-pending`;
      # this step, after setup-xcode has picked Xcode, prints the real key to the job
      # summary so a follow-up can rename the directory and drop the override.
      - uses: pyrlyn/ci/.github/actions/snapshot-version@main
        with:
          env-prefix: COX
          override: hosted-pending

      # Pass markers (T63.2): `actions/cache` keys are immutable, so each run saves a new key and
      # restores the newest by prefix. A pull request reads its own and main's caches only.

      - name: swift test pass markers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: desktop/macos/build/swift-test-pass
          key: swift-test-pass-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: swift-test-pass-v1-

      # Serial: the UI tests share one NSApplication (key window, appearance, main run loop),
      # and the benchmark times the main thread, so tests running alongside break both. Every
      # package selected runs before the step fails; snapshots that do not match are uploaded.
      - name: swift test
        # A hung test (the run loop waiting on a window) would otherwise hold the runner for 6 h.
        timeout-minutes: 60
        env:
          SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshots
          # Only a pull request may skip; any other trigger tests every package.
          COX_SWIFT_TEST_ALL: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: bash scripts/desktop/swift_test.sh

      # After a failure too, so the packages that passed keep their markers.
      - name: save swift test pass markers
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: desktop/macos/build/swift-test-pass
          key: swift-test-pass-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: snapshots that did not match
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore

      # The app target over those packages (T37.32.1): XcodeGen's Cox.xcodeproj, a Debug build
      # with signing off — no identity or secret in this job.
      - name: Cox.app
        run: |
          set -euo pipefail
          mise install aqua:yonaskolb/XcodeGen
          mise exec -- bash scripts/desktop/app.sh CODE_SIGNING_ALLOWED=NO

      # A Swift dependency change (Package.swift, Package.resolved, project.yml):
      # the full build above must have resolved exactly the committed pins, so a
      # stale or hand-edited Package.resolved fails here instead of drifting.
      - name: Swift pins unchanged by the build
        if: needs.changes.outputs.swift_full == 'true'
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- '*.resolved' desktop/macos/project.yml; then
            echo "the build rewrote the Swift dependency pins above: commit the resolved files" >&2
            exit 1
          fi

  # The script unit tests that do not need macOS (they use fakes, no Xcode): which Swift packages
  # desktop-macos may skip on a pull request (T63.2), the sccache wiring and xcframework.sh's
  # skip stamp. Moved off desktop-macos-lint: OS-independent work runs on Linux.
  scripts:
    needs: config
    if: >-
      !cancelled() && needs.config.outputs.docs-only != 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: swift test selection
        run: python3 -m unittest discover -s scripts/desktop -p 'test_swift_test_select.py'
      - name: sccache wiring
        run: python3 -m unittest discover -s scripts -p 'test_sccache_config.py'

      - name: xcframework.sh skip stamp
        run: python3 -I -m unittest discover -s scripts/desktop -p 'test_xcframework.py'

  # The desktop design tokens (T37.17, DS§2): regenerate Tokens.swift,
  # Colors.xcassets and tokens.css from desktop/design/tokens/*.json and fail
  # on any change, like the config-schema drift test. Node only, so Linux.
  desktop-tokens:
    needs: config
    if: >-
      !cancelled() && needs.config.outputs.docs-only != 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node

      - name: regenerate the tokens
        working-directory: desktop/design
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: no drift
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "generated tokens drifted: run \`just desktop-tokens\` and commit" >&2
            exit 1
          fi

  # Docs-only pull requests: the tests that validate docs/ (`just docs-check`: docs/config.md
  # covers every key, the docs name every subcommand and their links resolve, docs/ide.md,
  # generated docs/config.md, the getting-started keymap table). Skipped otherwise: the `rust`
  # job runs the same tests.
  docs:
    needs: config
    if: >-
      !cancelled() && needs.config.outputs.docs-only == 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO: cargo # Rust comes from the rust action; no `mise exec` in the recipe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pyrlyn/ci/.github/actions/setup-rust@main

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false

      - uses: taiki-e/install-action@b6a061addd82b81aaeca51bdf2c53cd707996e5a # just

      # cox-voice's build packages, as in the `rust` job.
      - name: build packages
        run: bash .github/actions/voice/install.sh

      - name: docs check
        run: just docs-check
