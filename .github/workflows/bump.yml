# The only way to a release, and the only thing that creates a `v*` tag
# (pyrlyn/ci bump.yml). `scripts/release.sh <level> --local` raises
# [workspace.package].version (only when it is already tagged), refreshes
# Cargo.lock and writes the CHANGELOG.md section from the commits since the
# last tag, as one `chore: release vX.Y.Z` commit. bump pushes it to
# `release/bump-vX.Y.Z` and opens a pull request into main with
# RELEASE_PLZ_TOKEN, so the pull request's own CI (ci.yml, pipeline.yml) reports
# every required check of protect-main. Once they are green, bump
# rebase-merges it with GITHUB_TOKEN (no ruleset bypass), reads back the commit
# that landed on main, tags it, creates a draft release with the changelog
# section and dispatches release.yml on the tag, which builds, uploads and
# publishes it. Red checks, a timeout or a failed merge close the pull request:
# no tag, no release. `dry-run` stops after the checks.
name: Bump and release

on:
  workflow_dispatch:
    inputs:
      level:
        description: version part to raise
        default: patch
        type: choice
        options: [patch, minor, major]
      dry-run:
        description: open the version pull request and wait for its checks, then close it
        default: false
        type: boolean
      release-untagged-head:
        description: release the untagged version already on main (nothing to commit) as it stands
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  bump:
    uses: pyrlyn/ci/.github/workflows/bump.yml@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main
    permissions:
      contents: write # the bump branch, the tag and the release
      pull-requests: write # merge or close the bump pull request
      actions: write # dispatch release.yml (and ci.yml, pipeline.yml for release-untagged-head)
      checks: read # wait for the required checks
      statuses: read
      issues: write # notify-failure: a failed run opens a release-failure issue
    with:
      level: ${{ inputs.level }}
      dry-run: ${{ inputs.dry-run }}
      release-untagged-head: ${{ inputs.release-untagged-head }}
      # scripts/release.sh, ci.yml + pipeline.yml and release.yml are pyrlyn/ci's defaults.
      mise-install-args: rust
    secrets:
      BUMP_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
