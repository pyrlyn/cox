# Dependabot: weekly, one grouped PR per ecosystem for patch updates and one
# for minor updates; a major bump gets its own PR because it is a review, not
# a merge. Every one of them runs the full CI (ci.yml) on its own;
# .github/workflows/dependabot.yml merges a patch update once that run is
# green; minor and major updates are labelled `needs-review`.
# Cargo covers the workspace and the fuzz targets (their own workspace and
# lockfile).
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      cargo-patch:
        update-types: ["patch"]
      cargo-minor:
        update-types: ["minor"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-patch:
        update-types: ["patch"]
      actions:
        update-types: ["minor", "major"]
