<svg xmlns="http://www.w3.org/2000/svg" width="864" height="1284" viewBox="0 0 864 1284" font-family="SF Mono, Menlo, DejaVu Sans Mono, Consolas, monospace" font-size="14">
<rect width="100%" height="100%" rx="8" fill="#1e1e1e"/>
<text x="12.0" y="25.0" textLength="193.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" font-weight="bold">› what can I press here</text>
<text x="12.0" y="43.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">Every key, grouped by context.                                                                      </text>
<text x="12.0" y="61.0" textLength="789.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">[info] idle     Enter send · Shift+Tab mode cycle · @ file · / command · ? help · Shift+Enter </text>
<text x="12.0" y="79.0" textLength="781.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">newline · Alt+Enter newline · Ctrl+Enter newline · Ctrl+R history · Ctrl+T thinking · Ctrl+O </text>
<text x="12.0" y="97.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">transcript · Ctrl+E expand · Ctrl+G diff · Alt+V voice · Ctrl+K plugin leader · Ctrl+C quit · Ctrl+D</text>
<text x="12.0" y="115.0" textLength="277.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6"> quit · y copy · Shift+Y copy all</text>
<text x="12.0" y="133.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       running  Esc interrupt · Ctrl+C interrupt · Ctrl+B background · Ctrl+O transcript · Alt+Enter</text>
<text x="70.8" y="151.0" textLength="403.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6"> send now · Ctrl+Enter send now · Ctrl+U unqueue</text>
<text x="12.0" y="169.0" textLength="722.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       modal    Enter choose · Esc close · Up previous · Down next · Ctrl+E theme edit</text>
<text x="12.0" y="187.0" textLength="646.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       overlay  Esc close · ? close · PageUp scroll up · PageDown scroll down</text>
<text x="12.0" y="205.0" textLength="714.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /model [cheap|code|think] [model]                        switch a tier's model</text>
<text x="12.0" y="223.0" textLength="823.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /think &lt;prompt&gt;                                          one turn on the think tier, price </text>
<text x="70.8" y="241.0" textLength="126.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">confirmed first</text>
<text x="12.0" y="259.0" textLength="831.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /mode architect|editor                                   switch between planning and editing</text>
<text x="12.0" y="277.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /effort [low|medium|high|xhigh]                          effort for the rest of the session; </text>
<text x="70.8" y="295.0" textLength="252.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">bare restores the tier default</text>
<text x="12.0" y="313.0" textLength="730.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /compact [focus]                                         compact the context now</text>
<text x="12.0" y="331.0" textLength="823.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /rewind                                                  go back to an earlier turn: code, </text>
<text x="70.8" y="349.0" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">conversation or both</text>
<text x="12.0" y="367.0" textLength="814.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /undo                                                    undo the last turn's file changes</text>
<text x="12.0" y="385.0" textLength="747.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /redo                                                    redo what /undo took back</text>
<text x="12.0" y="403.0" textLength="764.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /cost                                                    what this session has spent</text>
<text x="12.0" y="421.0" textLength="823.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /context                                                 where the next request's tokens go</text>
<text x="12.0" y="439.0" textLength="772.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /repomap [refresh]                                       show or rebuild the repo map</text>
<text x="12.0" y="457.0" textLength="814.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /autocompact                                             the compaction threshold and its </text>
<text x="70.8" y="475.0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">config source</text>
<text x="12.0" y="493.0" textLength="798.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /permissions [default|plan|auto|bypass]                  show or set the permission mode</text>
<text x="12.0" y="511.0" textLength="705.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /sandbox &lt;read-only|workspace-write|danger-full-access&gt;  set the sandbox mode</text>
<text x="12.0" y="529.0" textLength="814.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /resume                                                  pick an earlier session to resume</text>
<text x="12.0" y="547.0" textLength="789.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /sessions                                                this project's recent sessions</text>
<text x="12.0" y="565.0" textLength="680.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /rename &lt;title&gt;                                          name this session</text>
<text x="12.0" y="583.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /expand &lt;id&gt;                                             show an archived tool output in full</text>
<text x="12.0" y="601.0" textLength="831.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /agents                                                  live cox sessions in this workspace</text>
<text x="12.0" y="619.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /loop &lt;interval&gt; &lt;prompt&gt; [--budget usd] | /loop stop    repeat a prompt on a timer with its </text>
<text x="70.8" y="637.0" textLength="117.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">own budget cap</text>
<text x="12.0" y="655.0" textLength="823.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /refine &lt;text|list|undo&gt; [--global]                      review, apply or undo a change to </text>
<text x="70.8" y="673.0" textLength="176.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">notes, memory, skills</text>
<text x="12.0" y="691.0" textLength="630.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /skills                                                  list skills</text>
<text x="12.0" y="709.0" textLength="621.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /hooks                                                   list hooks</text>
<text x="12.0" y="727.0" textLength="764.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /mcp                                                     MCP servers and their tools</text>
<text x="12.0" y="745.0" textLength="722.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /plugin &lt;new|update|remove|list|reload&gt; ...              manage plugins (PL§13)</text>
<text x="12.0" y="763.0" textLength="680.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /doctor                                                  check the install</text>
<text x="12.0" y="781.0" textLength="764.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /clear                                                   new session, same directory</text>
<text x="12.0" y="799.0" textLength="831.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /fork [turn]                                             new child session with the history </text>
<text x="70.8" y="817.0" textLength="226.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">up to a turn (default: all)</text>
<text x="12.0" y="835.0" textLength="806.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /handoff &lt;objective&gt;                                     new child session seeded with a </text>
<text x="70.8" y="853.0" textLength="260.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">cheap summary and the objective</text>
<text x="12.0" y="871.0" textLength="806.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /init [--force]                                          scaffold AGENTS.md for this repo</text>
<text x="12.0" y="889.0" textLength="714.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /todo                                                    toggle the todo panel</text>
<text x="12.0" y="907.0" textLength="781.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /tasks                                                   list running background tasks</text>
<text x="12.0" y="925.0" textLength="663.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /vim                                                     toggle vim keys</text>
<text x="12.0" y="943.0" textLength="831.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /theme [name]                                            pick a colour theme, previewed live</text>
<text x="12.0" y="961.0" textLength="806.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /style [name]                                            list output styles, or apply one</text>
<text x="12.0" y="979.0" textLength="613.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /help                                                    this list</text>
<text x="12.0" y="997.0" textLength="571.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4" fill-opacity="0.6">       /quit                                                    exit</text>
<text x="12.0" y="1249.0" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#d4d4d4">&gt; </text>
<text x="28.8" y="1249.0" textLength="823.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#666666">Enter send · Shift+Tab mode cycle · @ file · / command · ? help                                   </text>
