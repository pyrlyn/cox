[package]
name = "cox-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cox-protocol = { path = "../cox-protocol", version = "0.1.2" }
# T32.8: permission engine moved to its own crate; re-exported at the old
# `permission` path (`crates/cox-core/src/lib.rs`) so existing callers keep
# working.
cox-permission = { path = "../cox-permission", version = "0.1.2" }
# T33.9: `redact::scrub`'s pattern table moved to this pure leaf so the
# plugin host redacts with the same one; re-exported at the old path.
cox-sanitize = { path = "../cox-sanitize", version = "0.1.2" }
# T33.40.8: `route`'s cache-aware filter prices both tiers from the same
# embedded catalog the ledger uses; a pure leaf that `deps.rs` already allows.
cox-models = { path = "../cox-models", version = "0.1.2" }
async-trait = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
cox-provider = { path = "../cox-provider", version = "0.1.2" }
# T2.5: the `big_tool_output` scenario follows the trailer with a real `expand` call.
cox-tools = { path = "../cox-tools", version = "0.1.2" }
insta = { workspace = true }
serde = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
