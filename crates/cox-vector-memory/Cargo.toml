[package]
name = "cox-vector-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Long-term agent memory on embedded Qdrant Edge"

[features]
# Off: qdrant-edge forces parking_lot `deadlock_detection`, which cannot
# coexist with `send_guard` (enabled by nucleo) in the cox workspace.
default = []
qdrant-edge = ["dep:qdrant-edge"]
# Statically linked sqlite-vec (`vec0` tables) registered on every connection.
sqlite-vec = ["dep:sqlite-vec"]

[dependencies]
qdrant-edge = { version = "=0.9.0", optional = true }
diesel = { workspace = true }
libsqlite3-sys = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlite-vec = { version = "=0.1.6", optional = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
