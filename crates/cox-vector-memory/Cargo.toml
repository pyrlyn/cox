[package]
name = "cox-vector-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Long-term agent memory on embedded Qdrant Edge"

[features]
default = ["qdrant-edge"]
qdrant-edge = ["dep:qdrant-edge"]

[dependencies]
qdrant-edge = { version = "=0.9.0", optional = true }
diesel = { workspace = true }
libsqlite3-sys = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
