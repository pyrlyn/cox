[package]
name = "cox-ext"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cox-protocol = { path = "../cox-protocol", version = "0.1.2" }
# T67.2: an http hook POSTs through cox-web so reqwest stays in the crate
# that opens the socket.
cox-web = { path = "../cox-web", version = "0.1.2" }
# T44.2: presence text names another session's worktree path to the model,
# through the one terminal-text guard.
cox-sanitize = { path = "../cox-sanitize", version = "0.1.2" }
# T7.2: frontmatter (serde-saphyr since T7.9, plan §1.1 cox-ext row), the `skill` tool
# (async-trait like every Tool impl), JSON schemas and structured output.
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
# T7.4: the hook runner spawns `sh -c` with a timeout that kills the whole
# process group (nix, as in cox-tools).
tokio = { workspace = true }
nix = { workspace = true, features = ["signal"] }
pathdiff = { workspace = true }
# T22.3: a `matcher` that is not a plain tool name compiles as a regex.
regex = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[lints]
workspace = true
