[package]
name = "cox-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cox-protocol = { path = "../cox-protocol", version = "0.1.2" }
# T32.3: `path::confine` and `sandbox` moved to their own crate; re-exported
# at the old paths (`crates/cox-tools/src/lib.rs`) so existing callers keep
# working.
cox-sandbox = { path = "../cox-sandbox", version = "0.1.2" }
# T32.6: the pure V4A parse/match/stage engine; this crate keeps the
# apply_patch Tool impl (path::confine, atomic_write).
cox-patch = { path = "../cox-patch", version = "0.1.2" }
# T32.4: `outline` (AST signature extraction) and bash's parser setup
# (`parse_bash`) moved to their own crate; `outline` is re-exported at its
# old path (`crates/cox-tools/src/lib.rs`) so existing callers keep working.
cox-syntax = { path = "../cox-syntax", version = "0.1.2" }
# T32.5: the pure grep/glob walk, match and fuzzy-rank engine; this crate
# keeps the grep/glob Tool impls (path::confine, archiving).
cox-search = { path = "../cox-search", version = "0.1.2" }
# T32.7: the pure web-fetch engine (HTTP GET + HTML→text); this crate keeps
# the web_fetch Tool impl (ToolCx, input parsing, output framing).
cox-web = { path = "../cox-web", version = "0.1.2" }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# T41.2: `LspError`, the first error enum this crate owns.
thiserror = { workspace = true }
schemars = { workspace = true }
# T3.4 (`edit`): unified diffs + closest-line ratio for NotFound suggestions.
similar = { workspace = true }
# T41.3: path <-> `file://` URI conversion for the LSP wire (A81).
url = { workspace = true }

# T57.7: `bash`'s pty, `setsid`, `killpg`, poll and termios are Unix-only;
# Windows gets its own spawn path in T57.8.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process", "poll", "term"] }

[dev-dependencies]
# T41.4: paused time, so the LSP quiet-period tests are exact, not timed.
tokio = { workspace = true, features = ["test-util"] }
rstest = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
