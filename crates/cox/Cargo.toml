[package]
name = "cox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# T35.7: `fake_agent` below makes this a two-binary package; `cargo run`
# must keep meaning `cox`.
default-run = "cox"

# T35.7: the test-only stand-in for Cursor's `agent` CLI that
# `tests/external_agents_cursor.rs` spawns. A `[[bin]]` because an
# integration test can only find a binary of its own package
# (`CARGO_BIN_EXE_fake_agent`); its only dependency is `serde_json`.
[[bin]]
name = "fake_agent"
path = "tests/support/fake_agent.rs"
test = false
doc = false

# T41.8: the test-only language server `tests/lsp.rs` points
# `lsp.servers.rust.command` at; same shape and dist exclusion as
# `fake_agent`, and its only dependency is `serde_json` too.
[[bin]]
name = "fake_lsp"
path = "tests/support/fake_lsp.rs"
test = false
doc = false

# T35.7: without this, dist puts `fake_agent` (and, T41.8, `fake_lsp`) in every release archive next
# to `cox` (checked with `dist plan`). One row per `targets` entry in
# dist-workspace.toml; a new target needs its row here too.
[package.metadata.dist.binaries]
aarch64-apple-darwin = ["cox"]
x86_64-unknown-linux-gnu = ["cox"]
aarch64-unknown-linux-gnu = ["cox"]

[features]
default = ["otel", "plugins", "app-server"]
# T32.9: the five otel crates moved to cox-telemetry; this forwards the
# feature rather than gating a dependency declared here.
otel = ["cox-telemetry/otel"]
# T33.3 (PL§12 falsifier 1): the WASM plugin host adds +16.8 MiB (extism and
# wasmtime) to the release binary. On by default; a slim build drops it with
# `--no-default-features --features otel`. Plugin code sits behind
# `#[cfg(feature = "plugins")]`.
plugins = ["dep:cox-plugin", "dep:cox-plugin-api", "cox-session/plugins"]
# T52.19: `cox app-server --stdio` serves the desktop app's `cox-app` over
# the wire. cox-app builds on cox-session's plugin host, so this implies
# `plugins`; the slim build drops both.
app-server = ["dep:cox-app", "plugins"]
# T54.5 (A123): push-to-talk dictation and `cox voice`. Off by default:
# whisper.cpp is a C++ build (cmake) and audio capture links the platform's
# sound stack (ALSA headers on Linux). `--features voice` turns it on.
voice = ["dep:cox-voice"]

[dependencies]
clap = { workspace = true }
cox-protocol = { path = "../cox-protocol", version = "0.1.2" }
cox-plugin = { path = "../cox-plugin", version = "0.1.2", optional = true }
# T33.4: `plugin_cmd::list` reads a manifest's declared `Capabilities` to
# summarise a plugin without running it; `cox-plugin` (the extism host)
# does not re-export the manifest/ABI types.
cox-plugin-api = { path = "../cox-plugin-api", version = "0.1.2", optional = true }
# T54.5: the pinned whisper model table (`cox voice model`); T54.7 adds
# the dictation the TUI receives.
cox-voice = { path = "../cox-voice", version = "0.1.2", optional = true }
cox-core = { path = "../cox-core", version = "0.1.2" }
cox-provider = { path = "../cox-provider", version = "0.1.2" }
cox-tools = { path = "../cox-tools", version = "0.1.2" }
cox-mcp = { path = "../cox-mcp", version = "0.1.2" }
cox-store = { path = "../cox-store", version = "0.1.2" }
cox-ext = { path = "../cox-ext", version = "0.1.2" }
cox-tui = { path = "../cox-tui", version = "0.1.2" }
cox-acp = { path = "../cox-acp", version = "0.1.2" }
# T32.1: `plain.rs` calls `sanitize` directly instead of pulling in the
# whole TUI crate for it.
cox-sanitize = { path = "../cox-sanitize", version = "0.1.2" }
# T32.9: process-wide logging and the OTLP stack.
cox-telemetry = { path = "../cox-telemetry", version = "0.1.2" }
# T30.25: `session.rs` resolves each provider's `Caps.max_context` from the
# catalog before construction (the provider itself only takes `&Transport`).
cox-models = { path = "../cox-models", version = "0.1.2" }
# T32.16: config loading, guards, provenance and `cox config set` live in
# cox-config (figment and toml_edit with them); this crate keeps the flag
# layer built from `Cli` and the printing.
cox-config = { path = "../cox-config", version = "0.1.2" }
# T37.1: session assembly (provider, tools, MCP, skills, hooks, plugins);
# this crate keeps the flags, the TUI loop and the printing. Its `plugins`
# feature follows this crate's.
cox-session = { path = "../cox-session", version = "0.1.2", default-features = false }
# T52.19: the app-server surface; optional behind `app-server`.
cox-app = { path = "../cox-app", version = "0.1.2", optional = true }
# anyhow at the cox-crate boundary (AGENTS.md: "anyhow only in crates/cox"),
# serde_json to build the CLI-flag override layer and `--json` output.
anyhow = { workspace = true }
# T37.2: `cox_acp::SessionFactory` is an async trait (`acp_cmd`).
async-trait = { workspace = true }
# T33.29: `plugin_new::PluginNewError`, so the TUI's future `/plugin new`
# (T33.30) gets a typed error to match on instead of anyhow's text.
thiserror = { workspace = true }
# T0.7: the CLI boundary loads .env/.env.local before parsing flags.
dotenvy = { workspace = true }
serde_json = { workspace = true }
# T0.5: doctor command checks: keyring for API key detection, crossterm for terminal size
keyring = { workspace = true }
crossterm = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
# T12.2: `cox self update` downloads releases (reqwest) and verifies their
# sha256 checksums (sha2) before replacing the binary.
reqwest = { workspace = true }
sha2 = { workspace = true }
# T5.8: the binary owns the async runtime the TUI and core loop run on.
tokio = { workspace = true }

[dev-dependencies]
# T37.1: the plugin and scripted-session fixtures `session.rs`'s render test
# shares with cox-session's own tests.
cox-session = { path = "../cox-session", version = "0.1.2", default-features = false, features = ["test-util"] }
tempfile = { workspace = true }
# T32.16: the shared env-var lock (`temp_env`) for env-mutating tests.
cox-config = { path = "../cox-config", version = "0.1.2", features = ["test-util"] }
# T12.3: `tests/docs.rs` walks `default.toml`'s keys (was a normal
# dependency until T32.16 moved `cox config set` to cox-config).
toml_edit = { workspace = true }
# T6.1: `cox run -p` per output format against the real binary.
assert_cmd = { workspace = true }
predicates = { workspace = true }
# T48.1: the full `cox run -p` output as reviewed `tests/cmd/*.toml` fixtures.
trycmd = { workspace = true }
insta = { workspace = true }
# T5.8: PTY end-to-end of the real binary (plan D10).
portable-pty = { workspace = true }
vt100 = { workspace = true }
# T33.17: `plugin_chat_section_builds_openai_shaped_client` and
# `plugin_provider_request_has_usage_row` drive a merged `[[provider]]`
# section's real OpenAI-shaped client against a mock server, no real
# network — already a workspace dependency (`cox-provider-openai`'s own
# wiremock tests).
wiremock = { workspace = true }
# T33.28: the Rust reference plugin built from `plugins/examples/rust` for
# `tests/plugins.rs` and `examples/plugin_bench.rs` (PL§13); a workspace
# crate with no dependencies of its own.
cox-plugin-fixtures = { path = "../cox-plugin-fixtures" }

[[example]]
name = "plugin_bench"
required-features = ["plugins"]

[lints]
workspace = true
