[package]
name = "cox-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cox-protocol = { path = "../cox-protocol", version = "0.1.2" }
# T6.2: MCP server over stdio (plan §1.1 row: rmcp 3.2 client+server).
rmcp = { workspace = true }
# T7.6: MCP client — servers become `Tool` impls (async-trait like every
# other tool); `.mcp.json` / `~/.claude.json` are read as plain JSON.
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# T64.24: the tool-contract hash. `sha2` is already a workspace dependency
# (cox-store's archive digests); this crate needs the same hash and must
# not take a dependency on cox-store to get it.
sha2 = { workspace = true }
# T22.5: OAuth for HTTP servers — tokens live in the OS keyring (the same
# `cox/<account>` entries the providers use); `reqwest` is the client rmcp's
# `AuthClient` wraps, so the crate names it rather than relying on rmcp's
# feature to pull it in.
keyring = { workspace = true }
# rmcp 3.4 implements its HTTP client trait for reqwest 0.13, which it already
# pulls in; the workspace row (0.12, for the providers) is a different type.
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "system-proxy"] }

[dev-dependencies]
tempfile = { workspace = true }
# T64.24: the quarantine test indexes a pending tool's spec through the
# real `tool_search`, which already reads `spec().description`.
cox-tools = { path = "../cox-tools", version = "0.1.2" }
# T22.5: the OAuth contract test plays authorization server and MCP server.
wiremock = { workspace = true }

[lints]
workspace = true
