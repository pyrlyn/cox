[package]
name = "cox-i18n"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Catalog parsing, Plural-Forms, `{name}` placeholders and the localizer.
# Version from crates.io, not a path: cox keeps only its catalogs and export.
gettext-catalog = { workspace = true }
thiserror = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[[bin]]
name = "po-export"
path = "src/bin/po-export.rs"

[lints]
workspace = true
