[package]
name = "cox-acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cox-protocol = { path = "../cox-protocol", version = "0.1.2" }
cox-core = { path = "../cox-core", version = "0.1.2" }
# Every rendered `Event::Task*` string goes through the shared sanitize guard
# before it reaches the ACP client (T34.8); a pure leaf, no new external dep.
cox-sanitize = { path = "../cox-sanitize", version = "0.1.2" }
# The ACP client (T35.3) serves an external agent's `fs/*` requests through
# the same `path::confine` guard and sandbox policy as every other path
# (EA§4); a guard crate, no new external dep.
cox-sandbox = { path = "../cox-sandbox", version = "0.1.2" }
# An external agent's `terminal/*` command runs through `bash`'s own runner
# and is rated by its `classify` (T35.11, EA§4): no second spawn path.
cox-tools = { path = "../cox-tools", version = "0.1.2" }
agent-client-protocol = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
# `CancellationToken`, the stop signal `bash`'s runner takes (T35.11).
tokio-util = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
# An external agent's whole-file ACP diff becomes the unified diff Changes
# and Review read (T52.3); already a workspace dependency, nothing new.
similar = { workspace = true }

[dev-dependencies]
cox-provider = { path = "../cox-provider", version = "0.1.2" }
tempfile = { workspace = true }
# The update fold's snapshot test (T52.3); already a workspace dev-dependency.
insta = { workspace = true }

[lints]
workspace = true
