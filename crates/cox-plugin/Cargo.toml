[package]
name = "cox-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The WASM plugin host (plan.md §1.1, A52, docs/design/plugins.md). The only
# crate that depends on extism; `crates/cox/tests/deps.rs` holds that line.
[dependencies]
# T33.11: `PluginHooks` implements the protocol's `Hook`, an `async_trait`
# trait; already a workspace dependency of every crate that implements it.
async-trait = { workspace = true }
cox-plugin-api = { path = "../cox-plugin-api", version = "0.1.2" }
# T33.6: `grant::check` reads the `PluginGrant` row `PluginStore` returns;
# PL§3 puts that trait and its types in the protocol crate.
cox-protocol = { path = "../cox-protocol", version = "0.1.2" }
# T33.9: `cox_notify`/`cox_log` text is sanitized and the context snapshot
# redacted with the one guard each (`sanitize`, `redact::scrub`).
cox-sanitize = { path = "../cox-sanitize", version = "0.1.2" }
extism = { workspace = true }
# T33.4: `plugin.toml` is parsed the way `config_load` parses cox's own
# config (figment's `Toml` provider, already workspace-pinned); this is the
# one module that owns plugin-manifest loading (PL§2, AGENTS "Config files").
figment = { workspace = true }
# T33.14.1: `cox_http` sends the guest's request host-side (PL§4); the
# workspace's one HTTP client, rustls only, so no new TLS stack.
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# T33.4: the PL§1 package digest (SHA-256 over the tree); already a
# dependency of `cox`, `cox-store` and `cox-provider-testkit`.
sha2 = { workspace = true }
thiserror = { workspace = true }
# T33.11: `PluginHost::call` blocks on the plugin's worker, so `PluginHooks`
# runs it on `spawn_blocking`; T33.15: `cox_model_call` blocks a plugin's
# worker thread (a plain OS thread, not a tokio runtime worker) on
# `ModelCaller::call` via `Handle::block_on`. The workspace's one async runtime.
tokio = { workspace = true }
# T33.9: `cox_log` writes to cox's log (PL§4); already workspace-pinned.
tracing = { workspace = true }
# Only to switch on wasmtime's `anyhow` feature, which extism needs and does
# not enable with its default features off (workspace Cargo.toml).
wasmtime = { workspace = true }

[dev-dependencies]
# T33.10: `tap_never_blocks_emit` runs a scripted session (`Session` over
# `Scripted`) with a slow plugin tapped in; dev-only, so the runtime graph
# keeps cox-plugin beside cox-core, not above it (crates/cox/tests/deps.rs).
cox-core = { path = "../cox-core", version = "0.1.2" }
cox-provider = { path = "../cox-provider", version = "0.1.2" }
tempfile = { workspace = true }
tokio = { workspace = true }
# T33.12: a test builds the `ToolCx` a `WasmTool` runs under, whose
# `cancel` is tokio-util's token; already a workspace dependency.
tokio-util = { workspace = true }
# T33.14.1: `cox_http` tests run against a local mock server, never the
# network; already the workspace's HTTP mock.
wiremock = { workspace = true }

[lints]
workspace = true
