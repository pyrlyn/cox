[package]
name = "cox-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cox-protocol = { path = "../cox-protocol", version = "0.1.2" }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tempfile = { workspace = true }

# T4.2: Linux confinement without bwrap — Landlock for the filesystem,
# seccomp for the network. Linux-only crates, so gated on the target.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }
seccompiler = { workspace = true }

# T64.15.1: `open::open_confined` needs `O_NOFOLLOW` and, on macOS,
# `F_GETPATH` on every Unix target, not only Linux.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

[lints]
workspace = true
