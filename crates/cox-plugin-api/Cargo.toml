[package]
name = "cox-plugin-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The plugin contract stays permissive like the guest SDK built on it (`plugins/`), so a
# third party can ship a closed-source plugin without taking cox's own licence (A68).
license = "MIT OR Apache-2.0"

# Pure and wasm32-clean (plan.md §1.1, A52): the guest SDK builds on it for
# `wasm32-unknown-unknown`, so no workspace crate and nothing that does I/O.
[dependencies]
serde = { workspace = true }
# ABI fields that carry cox-protocol types are `serde_json::Value` (A52).
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Tests parse `plugin.toml` text the way cox's config loader does (figment's
# Toml provider, already workspace-pinned); loading proper lives in
# `cox-plugin` (PL§2), so the api crate carries no TOML parser of its own.
figment = { workspace = true }

[lints]
workspace = true
