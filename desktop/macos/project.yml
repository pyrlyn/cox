# The macOS app's Xcode project (DT§6, DT§7, A106), for XcodeGen (the mise.toml pin):
# `just desktop-app` generates the gitignored Cox.xcodeproj from this spec and builds it. Only
# the app target lives here — `@main`, scenes, entitlements, Info.plist, assets under App/ —
# and every other line of Swift lives in the local packages, so the project stays a few lines
# of spec and never merge-conflicts.
#
# Both configurations are ad-hoc signed (`-`): no signing identity, no team, no Keychain. The
# DMGs are re-signed with Developer ID by scripts/desktop/dmg.sh (T37.32.3); Release has the
# Hardened Runtime notarization needs (T37.32.2). Sparkle checks only when the build passes
# COX_SPARKLE_PUBLIC_KEY, which the release does; with it empty the updater stays off.
name: Cox
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Apple Silicon only (DT§11 Q2): Debug builds the active arch alone anyway, but Release
    # would otherwise build x86_64 too, which CoxFFI.xcframework does not have.
    ARCHS: arm64
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CoxCore:
    path: Packages/CoxCore
  CoxModel:
    path: Packages/CoxModel
  CoxPlatform:
    path: Packages/CoxPlatform
  CoxTranscript:
    path: Packages/CoxTranscript
  CoxUI:
    path: Packages/CoxUI
  # The launch registers the core, secret store and inbox the stores read (DT§4.6); MIT. The
  # same requirement as CoxModel's Package.swift, so both resolve to one version.
  swift-dependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    from: 1.17.1
  # T51.15: the global hotkeys' registration, recorder and storage (DT§4.6); MIT.
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
  # T37.32.2: CoxPlatform's updater; the same requirement as its Package.swift, so one version.
  # Named here so the app embeds Sparkle.framework, which a package's dynamic binary needs.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
targets:
  Cox:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: CoxCore
      - package: CoxModel
        products: [CoxClient, CoxModel]
      - package: CoxPlatform
      - package: CoxTranscript
      - package: CoxUI
      - package: KeyboardShortcuts
      - package: Sparkle
      - package: swift-dependencies
        product: Dependencies
    settings:
      base:
        PRODUCT_NAME: Cox
        # From the repository (github.com/pyrlyn/cox), confirmed by the creator for the first
        # signed build (T37.32.3). Fixed from here on: macOS keys notification, Keychain and
        # folder permissions to it, so a change would reset them for everyone.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.pyrlyn.cox
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Cox.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        # Sparkle's feed (DT§7): the newest release's asset, and a test release is never the
        # newest. Info.plist reads both; the key is the EdDSA public half, not a secret.
        COX_APPCAST_URL: https://github.com/pyrlyn/cox/releases/latest/download/appcast.xml
        COX_SPARKLE_PUBLIC_KEY: ""
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    scheme: {}
