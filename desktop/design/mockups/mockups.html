<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>cox desktop mockups</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<style>
/* Short names for the colour tokens in ../tokens/tokens.css (`just desktop-tokens`). A custom
   property resolves where it is declared, so `.dark` declares them again to pick up its values. */
:root,.dark{
  --win:var(--c-surface-window);--side:var(--c-surface-sidebar);
  --text:var(--c-text-primary);--sec:var(--c-text-secondary);--ter:var(--c-text-tertiary);--sep:var(--c-separator);--fill:var(--c-fill-primary);--fill2:var(--c-fill-secondary);
  --accent:var(--c-accent);--accent-soft:var(--c-accent-soft);--accent-selected:var(--c-accent-selected);--orange:var(--c-status-warning);--orange-soft:var(--c-status-warningSoft);
  --green:var(--c-status-success);--green-soft:var(--c-status-successSoft);--red:var(--c-status-danger);--red-soft:var(--c-status-dangerSoft);--blue:var(--c-status-plan);
  --add:var(--c-diff-add);--add-g:var(--c-diff-addGutter);--del:var(--c-diff-del);--del-g:var(--c-diff-delGutter);
  --code-bg:var(--c-surface-code);--glass:var(--c-surface-capsule);--glass-b:var(--c-surface-capsuleBorder);
  --purple:var(--c-role-project);--purple-soft:var(--c-role-projectSoft);
  --kw:var(--c-syntax-keyword);--str:var(--c-syntax-string);--num:var(--c-syntax-number);--fn:var(--c-syntax-function);--com:var(--c-syntax-comment);--ty:var(--c-syntax-type);
}
/* Mockup-only values that have no token. */
:root{
  --wall1:#9fb8e8;--wall2:#e7b7d6;--wall3:#f4d6a8;
  --side-b:rgba(0,0,0,.06);--shadow:0 30px 80px rgba(20,30,60,.35),0 0 0 .5px rgba(0,0,0,.25);
}
.dark{--side-b:rgba(255,255,255,.07)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1520px;height:980px;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;font-size:13px;line-height:1.45;color:var(--text);
  background:radial-gradient(1200px 700px at 15% 10%,var(--wall1),transparent 60%),radial-gradient(900px 700px at 90% 20%,var(--wall2),transparent 60%),radial-gradient(1000px 800px at 60% 100%,var(--wall3),transparent 60%),#c9cfe6;-webkit-font-smoothing:antialiased}
body.dark{background:radial-gradient(1200px 700px at 15% 10%,#2b3a66,transparent 60%),radial-gradient(900px 700px at 90% 20%,#5a2b50,transparent 60%),radial-gradient(1000px 800px at 60% 100%,#5b4320,transparent 60%),#1a1c26}
.mono,code,pre{font-family:"SF Mono",ui-monospace,Menlo,monospace}
.window{position:absolute;left:40px;top:40px;width:1440px;height:900px;background:var(--win);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:flex}
.window.small{width:980px;height:700px;left:270px;top:140px}
/* sidebar */
.sidebar{position:absolute;left:8px;top:8px;bottom:8px;width:252px;background:var(--side);border-radius:16px;border:.5px solid var(--side-b);backdrop-filter:blur(30px);display:flex;flex-direction:column;z-index:3;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.traffic{display:flex;gap:8px;padding:18px 16px 10px}
.traffic i{width:12px;height:12px;border-radius:50%;display:block}
.traffic i:nth-child(1){background:#ff5f57}.traffic i:nth-child(2){background:#febc2e}.traffic i:nth-child(3){background:#28c840}
.side-top{display:flex;align-items:center;justify-content:space-between;padding-right:12px}
.filter{margin:6px 12px 10px;height:28px;border-radius:9px;background:var(--fill);display:flex;align-items:center;gap:6px;padding:0 9px;color:var(--ter)}
.sect{font-size:11px;font-weight:600;color:var(--ter);padding:10px 18px 4px;display:flex;justify-content:space-between;letter-spacing:.02em}
.sect .cnt{background:var(--orange);color:#fff;border-radius:8px;padding:0 6px;font-size:10px;line-height:16px}
.proj{padding:6px 14px 2px 16px;font-weight:600;font-size:12px;color:var(--sec);display:flex;align-items:center;gap:6px}
.row{margin:1px 8px;padding:6px 10px;border-radius:9px;display:flex;gap:9px;align-items:flex-start}
.row.act{background:var(--accent-selected)}
.row .dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:none}
.row .t{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:11px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .b{min-width:0;flex:1}
.row .c{font-size:11px;color:var(--ter);margin-left:auto;flex:none}
.d-run{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.d-wait{background:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.d-idle{border:1.5px solid var(--ter)}
.d-err{background:var(--red)}
.side-foot{margin-top:auto;padding:10px 14px 14px;display:flex;align-items:center;justify-content:space-between;color:var(--sec);font-size:12px;border-top:.5px solid var(--sep)}
.btn-new{display:flex;align-items:center;gap:6px;font-weight:500;color:var(--text)}
.kbd{font-size:10.5px;color:var(--ter);border:.5px solid var(--sep);border-radius:4px;padding:0 4px;line-height:15px;font-family:-apple-system}
/* main */
.main{position:absolute;left:268px;top:0;right:0;bottom:0;display:flex;flex-direction:column}
.main.noside{left:0}
.toolbar{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px 0 16px;position:relative;z-index:2}
.cap{height:32px;border-radius:16px;background:var(--glass);border:.5px solid var(--glass-b);box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;align-items:center;padding:0 12px;gap:7px;font-size:12.5px;font-weight:500;backdrop-filter:blur(20px);white-space:nowrap}
.cap.icon{width:32px;padding:0;justify-content:center}
.crumb{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px}
.crumb .sub{color:var(--sec);font-weight:500;font-size:12.5px}
.seg{display:flex;height:32px;border-radius:16px;background:var(--glass);border:.5px solid var(--glass-b);padding:3px;gap:2px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.seg span{padding:0 11px;border-radius:13px;display:flex;align-items:center;font-size:12px;font-weight:500;color:var(--sec)}
.seg span.on{background:var(--win);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg span.plan.on{color:var(--blue)}
.seg span.byp.on{background:var(--red);color:#fff}
.spacer{flex:1}
.stop{background:var(--text);color:var(--win);border-radius:16px;height:32px;padding:0 12px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:12px}
.ring{width:14px;height:14px;border-radius:50%;background:conic-gradient(var(--accent) 0 38%,var(--fill2) 38% 100%);-webkit-mask:radial-gradient(circle 4px,transparent 98%,#000 100%)}
.bypass-strip{position:absolute;left:0;right:0;top:0;height:3px;background:var(--red);z-index:5}
.body{flex:1;display:flex;min-height:0}
.col{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.scroll{flex:1;overflow:hidden;padding:6px 0 0;position:relative;}
.reading{width:760px;margin:0 auto;position:relative}
.fadeTop{position:absolute;top:0;left:0;right:0;height:26px;background:linear-gradient(var(--win),transparent);z-index:1}
/* blocks */
.turn{position:relative;padding-left:0;margin-bottom:6px}
.gutter{position:absolute;left:-44px;top:4px;width:32px;text-align:right;font-size:11px;color:var(--ter);font-variant-numeric:tabular-nums}
.user{background:var(--fill);border-radius:12px;padding:10px 14px;margin:14px 0 10px;font-size:13.5px}
.user .att{display:flex;gap:8px;margin-top:8px}
.thumb{width:92px;height:60px;border-radius:8px;background:linear-gradient(135deg,#dfe7f7,#f5e3ef);border:.5px solid var(--sep);display:flex;align-items:flex-end;padding:4px 6px;font-size:10px;color:var(--sec)}
.asst{font-size:13.5px;margin:10px 0;line-height:1.55}
.asst p{margin:0 0 8px}
.asst code{font-size:12px;background:var(--fill);padding:1px 5px;border-radius:5px}
.asst h3{font-size:15px;margin:12px 0 6px}
.asst ul{padding-left:20px;margin:0 0 8px}
.think{color:var(--sec);font-size:12.5px;display:flex;align-items:center;gap:6px;margin:8px 0}
.think-body{color:var(--sec);font-size:12.5px;font-style:italic;border-left:2px solid var(--sep);padding:2px 0 2px 12px;margin:-2px 0 10px}
.tool{border-radius:10px;margin:4px 0;font-size:13px}
.tool .h{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:10px}
.tool.exp{border:.5px solid var(--sep);background:var(--win)}
.tool.exp .h{border-bottom:.5px solid var(--sep);border-radius:10px 10px 0 0;background:var(--fill)}
.tool .ic{width:22px;height:22px;border-radius:6px;background:var(--fill2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--sec)}
.tool .sum{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool .sum b{font-weight:600}
.tool .st{font-size:11.5px;color:var(--sec);display:flex;align-items:center;gap:6px;flex:none}
.plus{color:var(--green);font-weight:600}.minus{color:var(--red);font-weight:600}
.ok{color:var(--green)}.bad{color:var(--red)}
.tail{margin:2px 0 6px 41px;background:var(--code-bg);border-radius:8px;padding:8px 10px;font-size:11.5px;line-height:1.5;color:var(--sec);border:.5px solid var(--sep)}
.tail .l{white-space:pre;overflow:hidden;text-overflow:ellipsis}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--fill2);border-top-color:var(--accent);display:inline-block}
.risk{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--orange-soft);color:var(--orange)}
.diff{font-size:11.8px;line-height:1.55;padding:6px 0}
.diff .ln{display:flex;white-space:pre}
.diff .n{width:38px;text-align:right;padding-right:10px;color:var(--ter);flex:none;user-select:none}
.diff .c{flex:1;padding-left:8px;overflow:hidden;text-overflow:ellipsis}
.diff .a{background:var(--add)}.diff .a .n{background:var(--add-g);color:var(--text)}
.diff .d{background:var(--del)}.diff .d .n{background:var(--del-g);color:var(--text)}
.diff .hh{color:var(--sec);background:var(--fill);padding:2px 10px;font-size:11px}
.kw{color:var(--kw)}.str{color:var(--str)}.num{color:var(--num)}.fn{color:var(--fn)}.com{color:var(--com)}.ty{color:var(--ty)}
.more{font-size:12px;color:var(--accent);padding:6px 12px;border-top:.5px solid var(--sep)}
.codeblock{background:var(--code-bg);border-radius:10px;border:.5px solid var(--sep);margin:8px 0 10px;overflow:hidden}
.codeblock .ch{display:flex;justify-content:space-between;font-size:11px;color:var(--sec);padding:5px 12px;border-bottom:.5px solid var(--sep)}
.codeblock pre{font-size:12px;padding:10px 12px;line-height:1.55}
.meta{font-size:11px;color:var(--ter);display:flex;gap:12px;margin:4px 0 14px}
.notice{font-size:12px;color:var(--sec);display:flex;gap:8px;align-items:center;margin:8px 0}
.divider{display:flex;align-items:center;gap:12px;color:var(--sec);font-size:12px;margin:18px 0}
.divider:before,.divider:after{content:"";flex:1;height:.5px;background:var(--sep)}
/* approval */
.appr{border-radius:14px;border:.5px solid var(--sep);background:var(--win);box-shadow:0 2px 10px rgba(0,0,0,.06);overflow:hidden;margin:10px 0;position:relative}
.appr:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--orange)}
.appr .ah{display:flex;align-items:center;gap:8px;padding:12px 16px 6px 20px;font-weight:600;font-size:13.5px}
.appr .cmd{margin:4px 16px 8px 20px;background:var(--code-bg);border-radius:9px;padding:9px 12px;font-size:12.5px;border:.5px solid var(--sep)}
.appr .why{margin:0 16px 10px 20px;font-size:12px;color:var(--sec);display:flex;flex-direction:column;gap:3px}
.appr .why b{color:var(--text);font-weight:500}
.appr .acts{display:flex;gap:8px;padding:10px 16px 12px 20px;border-top:.5px solid var(--sep);background:var(--fill);align-items:center}
.pb{height:28px;border-radius:8px;padding:0 12px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;background:var(--win);border:.5px solid var(--sep);box-shadow:0 1px 2px rgba(0,0,0,.06);white-space:nowrap}
.pb.pri{background:var(--accent);color:#fff;border-color:transparent}
.pb.dan{color:var(--red)}
.pb .k{font-size:10.5px;opacity:.7}
.grant{font-size:11.5px;color:var(--sec);margin-left:auto}
.pinned{margin:0 auto 8px;width:760px;border-radius:12px;background:var(--orange-soft);border:.5px solid rgba(255,149,0,.35);padding:8px 12px;display:flex;align-items:center;gap:10px;font-size:12.5px}
.pinned .pb{height:24px;font-size:12px}
/* composer */
.composer{width:760px;margin:0 auto 18px;border-radius:18px;background:var(--win);border:.5px solid var(--sep);box-shadow:0 4px 18px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.04);position:relative}
.composer .ta{padding:13px 16px 6px;font-size:13.5px;min-height:46px}
.composer .ph{color:var(--ter)}
.composer .chips{display:flex;align-items:center;gap:6px;padding:6px 10px 10px}
.chip{height:26px;border-radius:13px;padding:0 10px;background:var(--fill);display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sec);white-space:nowrap}
.chip.blue{color:var(--blue);background:rgba(47,111,222,.12)}
.send{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;margin-left:auto}
.send.off{background:var(--fill2);color:var(--ter)}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 6px;font-size:12.5px;font-weight:500}
.caret{display:inline-block;width:1.5px;height:17px;background:var(--accent);vertical-align:-3px}
.pop{position:absolute;bottom:calc(100% + 8px);left:14px;width:470px;background:var(--glass);backdrop-filter:blur(30px);border:.5px solid var(--glass-b);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.22);padding:6px;z-index:10}
.body.dark .pop{background:rgba(40,40,44,.92)}
.pop .it{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;font-size:13px}
.pop .it.on{background:var(--accent);color:#fff}
.pop .it.on .x{color:rgba(255,255,255,.8)}
.pop .it .x{color:var(--sec);font-size:11.5px;margin-left:auto;white-space:nowrap}
.pop .hdr{font-size:11px;font-weight:600;color:var(--ter);padding:6px 10px 3px}
.hl{color:var(--accent);font-weight:600}
.pop .it.on .hl{color:#fff;text-decoration:underline}
/* inspector */
.insp{width:330px;flex:none;border-left:.5px solid var(--sep);display:flex;flex-direction:column;background:var(--win)}
.tabs{display:flex;gap:2px;padding:0 12px 10px;border-bottom:.5px solid var(--sep)}
.tabs span{font-size:12px;padding:4px 9px;border-radius:7px;color:var(--sec);font-weight:500}
.tabs span.on{background:var(--fill2);color:var(--text)}
.ib{padding:14px 16px;overflow:hidden;flex:1}
.ih{font-size:11px;font-weight:600;color:var(--ter);margin:4px 0 8px;letter-spacing:.02em;display:flex;justify-content:space-between}
.fr{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:12.5px}
.fr.on{background:var(--accent-soft)}
.fr .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .p .dir{color:var(--sec)}
.todo{display:flex;gap:9px;align-items:flex-start;padding:6px 2px;font-size:12.5px}
.box{width:15px;height:15px;border-radius:5px;border:1.5px solid var(--ter);flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.box.done{background:var(--green);border-color:var(--green)}
.box.doing{border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--win),inset 0 0 0 10px var(--accent)}
.todo.done span{color:var(--sec);text-decoration:line-through}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--fill2);margin:6px 0 8px}
.legend{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:12px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px}
.kv .k{color:var(--sec)}
table.t{width:100%;border-collapse:collapse;font-size:11.8px;font-variant-numeric:tabular-nums}
table.t th{font-weight:500;color:var(--ter);text-align:right;padding:4px 4px;border-bottom:.5px solid var(--sep);font-size:11px}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{text-align:right;padding:5px 4px;border-bottom:.5px solid var(--sep)}
.card{border:.5px solid var(--sep);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.badge{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--fill2);color:var(--sec);white-space:nowrap}
.badge.b-user{background:var(--accent-soft);color:var(--accent)}
.badge.b-project{background:var(--purple-soft);color:var(--purple)}
.badge.b-env{background:var(--green-soft);color:var(--green)}
.badge.b-default{background:var(--fill2);color:var(--sec)}
.badge.b-warn{background:var(--orange-soft);color:var(--orange)}
.badge.b-red{background:var(--red-soft);color:var(--red)}
.gauge{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden;margin-top:6px}
.gauge i{display:block;height:100%;background:var(--accent)}
/* overlays */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.18);z-index:20}
.palette{position:absolute;left:50%;top:120px;transform:translateX(-50%);width:640px;background:var(--glass);backdrop-filter:blur(40px) saturate(1.4);border:.5px solid var(--glass-b);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.35);z-index:21;overflow:hidden}
.dark .palette,.dark .sheet{background:rgba(44,44,48,.94)}
.palette .q{display:flex;align-items:center;gap:10px;padding:16px 18px;font-size:18px;border-bottom:.5px solid var(--sep)}
.palette .lst{padding:6px}
.palette .it{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px;font-size:13.5px}
.palette .it.on{background:var(--accent);color:#fff}
.palette .it .x{margin-left:auto;font-size:11.5px;color:var(--sec)}
.palette .it.on .x{color:rgba(255,255,255,.8)}
.palette .it .ic2{width:26px;height:26px;border-radius:7px;background:var(--fill2);display:flex;align-items:center;justify-content:center;color:var(--sec)}
.palette .it.on .ic2{background:rgba(255,255,255,.2);color:#fff}
.palette .hdr{font-size:11px;font-weight:600;color:var(--ter);padding:8px 12px 4px}
.sheet{position:absolute;left:50%;top:70px;transform:translateX(-50%);width:600px;background:var(--win);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.2);z-index:21;padding:22px 24px}
.sheet h2{font-size:17px;margin-bottom:4px}
.sheet .sub{color:var(--sec);font-size:12.5px;margin-bottom:16px}
.field{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center;margin-bottom:12px;font-size:13px}
.field .lab{color:var(--sec);text-align:right}
.input{height:30px;border-radius:8px;border:.5px solid var(--sep);background:var(--fill);display:flex;align-items:center;padding:0 10px;gap:8px;font-size:13px}
.radio{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:.5px solid var(--sep);margin-bottom:6px}
.radio.on{border-color:var(--accent);background:var(--accent-soft)}
.radio .o{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--ter);flex:none;margin-top:2px}
.radio.on .o{border:4.5px solid var(--accent)}
.radio small{display:block;color:var(--sec);font-size:11.5px}
.sheet .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.popover{position:absolute;background:var(--glass);backdrop-filter:blur(30px);border:.5px solid var(--glass-b);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.25);padding:5px;z-index:12;font-size:13px}
.dark .popover{background:rgba(44,44,48,.95)}
.popover .it{padding:6px 12px;border-radius:7px;display:flex;gap:10px;align-items:center;white-space:nowrap}
.popover .it.on{background:var(--accent);color:#fff}
.popover .it .x{margin-left:auto;color:var(--ter);font-size:11.5px;padding-left:18px}
.popover .it.on .x{color:rgba(255,255,255,.8)}
.popover .sep{height:.5px;background:var(--sep);margin:4px 8px}
.popover .hdr{font-size:11px;color:var(--ter);font-weight:600;padding:5px 12px 3px}
/* settings */
.set-side{width:220px;flex:none;background:var(--side);border-right:.5px solid var(--sep);padding:0 8px}
.set-side .it{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:8px;font-size:13px;margin:1px 0}
.set-side .it.on{background:var(--accent);color:#fff}
.set-side .it .sq{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff}
.set-main{flex:1;padding:18px 28px;overflow:hidden}
.set-main h1{font-size:20px;margin:6px 0 16px}
.group{background:var(--fill);border-radius:12px;margin-bottom:16px;overflow:hidden}
.group .gr{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:.5px solid var(--sep);font-size:13px}
.group .gr:last-child{border-bottom:none}
.group .gr .l{flex:1}
.group .gr .l small{display:block;color:var(--sec);font-size:11.5px}
.gtitle{font-size:12px;font-weight:600;color:var(--sec);margin:0 0 6px 4px}
.sel{height:24px;border-radius:6px;background:var(--win);border:.5px solid var(--sep);padding:0 8px;display:flex;align-items:center;gap:6px;font-size:12.5px;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.tog{width:32px;height:19px;border-radius:10px;background:var(--green);position:relative}
.tog:after{content:"";position:absolute;right:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tog.off{background:var(--fill2)}.tog.off:after{right:auto;left:2px}
/* misc */
.menubar{position:absolute;left:0;right:0;top:0;height:30px;background:rgba(255,255,255,.35);backdrop-filter:blur(30px);display:flex;align-items:center;padding:0 16px;gap:20px;font-size:13px;font-weight:500;z-index:30}
.dark .menubar{background:rgba(0,0,0,.3)}
.menubar .r{margin-left:auto;display:flex;gap:16px;align-items:center}
.notif{position:absolute;right:20px;top:44px;width:370px;background:rgba(246,246,248,.8);backdrop-filter:blur(40px) saturate(1.6);border-radius:22px;box-shadow:0 10px 40px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.12);z-index:31;padding:12px 14px}
.notif .appi{width:36px;height:36px;border-radius:9px;flex:none}
.dock{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);height:74px;padding:8px 10px;border-radius:24px;background:rgba(255,255,255,.35);backdrop-filter:blur(30px);border:.5px solid rgba(255,255,255,.5);display:flex;gap:10px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.dock .a{width:56px;height:56px;border-radius:14px;position:relative}
.dock .a .bd{position:absolute;right:-4px;top:-4px;background:#ff3b30;color:#fff;border-radius:10px;font-size:12px;font-weight:600;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.appicon{background:linear-gradient(145deg,#1b2440,#2d3d6e);display:flex;align-items:center;justify-content:center;color:#ffd27a;font-weight:800;font-size:22px;font-family:"SF Mono",ui-monospace,monospace;letter-spacing:-1px}
.term{background:#15161a;color:#d9dde5;font-size:12px;line-height:1.5;padding:10px 14px;flex:none;height:250px;border-top:.5px solid var(--sep)}
.term .p1{color:#7ee787}.term .p2{color:#79c0ff}
.panehead{display:flex;align-items:center;gap:10px;padding:6px 12px;font-size:12px;color:var(--sec);border-top:.5px solid var(--sep);background:var(--fill)}
.panehead .tb{padding:2px 9px;border-radius:6px}
.panehead .tb.on{background:var(--win);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.caption{position:absolute;left:40px;bottom:12px;font-size:12px;color:rgba(0,0,0,.55);font-weight:500}
.dark .caption{color:rgba(255,255,255,.55)}
.agentb{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;color:#fff}
/* ===== glass theme: adjustable window transparency, frosted / glossy material, more depth ===== */
body.glass{background:#20264d}
.wallart{position:absolute;inset:0;overflow:hidden;z-index:0}
.wallart i{position:absolute;display:block;border-radius:50%}
.glass{--wa:.42;--wb:34px;--depth:1;
  --win:rgba(255,255,255,.74);--code-bg:rgba(248,249,252,.72);--fill:rgba(255,255,255,.42);--fill2:rgba(255,255,255,.55);
  --sep:rgba(40,45,90,.12);--text:#141726;--sec:#4d5270;--ter:#8388a6;--glass:rgba(255,255,255,.5);--glass-b:rgba(255,255,255,.75);
  --hl:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 .5px rgba(255,255,255,.55);
  --lift1:0 1px 2px rgba(25,30,80,.10),0 4px 10px rgba(25,30,80,.08);
  --lift2:0 2px 4px rgba(25,30,80,.10),0 10px 26px rgba(25,30,80,.14);
  --lift3:0 4px 10px rgba(25,30,80,.14),0 24px 60px rgba(25,30,80,.26);}
.glass .window{background:rgba(255,255,255,var(--wa));backdrop-filter:blur(var(--wb)) saturate(1.9);-webkit-backdrop-filter:blur(var(--wb)) saturate(1.9);
  border:.5px solid rgba(255,255,255,.55);box-shadow:0 50px 120px rgba(8,10,40,.55),0 16px 40px rgba(8,10,40,.3),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.25)}
/* specular sweep across the whole pane: strong for glossy, faint for frosted */
.glass .window:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:40;
  background:linear-gradient(118deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.08) 22%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 72%,rgba(255,255,255,.10) 100%);mix-blend-mode:soft-light}
.glass.glossy .window:after{background:linear-gradient(118deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.14) 18%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 64%,rgba(255,255,255,.22) 66%,rgba(255,255,255,0) 72%);mix-blend-mode:normal;opacity:.55}
.glass.glossy{--wb:6px;--wa:.30}
.glass .fadeTop{display:none}
.glass .sidebar{background:rgba(255,255,255,.34);border:.5px solid rgba(255,255,255,.8);box-shadow:var(--lift2),var(--hl),inset 0 -1px 0 rgba(30,30,80,.05);backdrop-filter:blur(24px) saturate(1.6)}
.glass .filter{background:rgba(255,255,255,.55);box-shadow:inset 0 1px 2px rgba(25,30,80,.10),0 1px 0 rgba(255,255,255,.8)}
.glass .row.act{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.72));box-shadow:var(--lift1),var(--hl)}
.glass .row.act .t{color:#0a5fd6}
.glass .sect .cnt{background:linear-gradient(180deg,#ffae3d,#f08a00);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 5px rgba(240,138,0,.4)}
.glass .d-run{background:radial-gradient(circle at 35% 30%,#8ff0a8,#1f9d45 70%)}
.glass .d-wait{background:radial-gradient(circle at 35% 30%,#ffd28a,#f08a00 70%)}
.glass .d-err{background:radial-gradient(circle at 35% 30%,#ffa39d,#e5352b 70%)}
.glass .side-foot{border-top:.5px solid rgba(255,255,255,.6)}
.glass .cap,.glass .seg{background:rgba(255,255,255,.55);border:.5px solid rgba(255,255,255,.85);box-shadow:var(--lift1),var(--hl);backdrop-filter:blur(16px)}
.glass .seg span.on{background:linear-gradient(180deg,#fff,#f1f3fa);box-shadow:0 1px 3px rgba(25,30,80,.2),inset 0 1px 0 #fff}
.glass .cap.hot{background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(236,242,255,.9));color:var(--accent);box-shadow:0 0 0 3px rgba(10,124,255,.18),var(--lift1),var(--hl)}
.glass .stop{background:linear-gradient(180deg,#3a3d4d,#16171f);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 12px rgba(10,12,30,.35)}
.glass .col{margin:0 8px 8px 0;border-radius:18px;background:rgba(255,255,255,.30);border:.5px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 12px 30px rgba(255,255,255,.18),0 2px 10px rgba(25,30,80,.06)}
.glass .insp{margin:0 8px 8px 0;border-radius:18px;background:rgba(255,255,255,.40);border:.5px solid rgba(255,255,255,.8);box-shadow:var(--lift2),var(--hl)}
.glass .tabs{border-bottom:.5px solid rgba(255,255,255,.7)}
.glass .tabs span.on{background:linear-gradient(180deg,#fff,#eef1f8);box-shadow:var(--lift1),var(--hl);color:var(--text)}
.glass .fr.on{background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.75));box-shadow:var(--lift1),var(--hl)}
.glass .user{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.72));box-shadow:var(--lift2),var(--hl)}
.glass .tool .h{background:rgba(255,255,255,.38);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 2px rgba(25,30,80,.05)}
.glass .tool.exp{background:rgba(255,255,255,.82);border:.5px solid rgba(255,255,255,.9);box-shadow:var(--lift2),var(--hl)}
.glass .tool.exp .h{background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(244,246,252,.9));box-shadow:none}
.glass .tool .ic{background:linear-gradient(180deg,#ffffff,#e4e8f3);box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(25,30,80,.22),0 0 0 .5px rgba(25,30,80,.08);color:#3d4466}
.glass .tool .ic.c-edit{background:linear-gradient(180deg,#5aa8ff,#1668e3);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 4px rgba(22,104,227,.35)}
.glass .tool .ic.c-term{background:linear-gradient(180deg,#4a4f63,#1d2030);color:#9ef0b5;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 4px rgba(10,12,30,.35)}
.glass .tool .ic.c-search{background:linear-gradient(180deg,#6fe0d0,#1aa39a);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 4px rgba(26,163,154,.35)}
.glass .tool .ic.c-doc{background:linear-gradient(180deg,#c7a6ff,#7c4ddb);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 4px rgba(124,77,219,.35)}
.glass .tail{background:linear-gradient(180deg,rgba(24,27,40,.86),rgba(18,20,30,.9));color:#c8cde0;border:.5px solid rgba(255,255,255,.15);box-shadow:inset 0 2px 8px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.7)}
.glass .tail .l:nth-last-child(-n+2){color:#8ff0a8}
.glass .diff .hh{background:rgba(240,242,250,.8)}
.glass .asst code{background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 .5px rgba(25,30,80,.12)}
.glass .composer{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.8));border:.5px solid rgba(255,255,255,.95);box-shadow:var(--lift3),var(--hl);backdrop-filter:blur(20px)}
.glass .chip{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(238,241,249,.9));box-shadow:0 1px 2px rgba(25,30,80,.12),inset 0 1px 0 #fff;color:var(--sec)}
.glass .send{background:linear-gradient(180deg,#4aa3ff,#0a66ee);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 4px rgba(0,40,120,.25),0 6px 14px rgba(10,102,238,.45)}
.glass .kbd{background:rgba(255,255,255,.6);border-color:rgba(25,30,80,.12);box-shadow:0 1px 0 rgba(25,30,80,.12)}
/* appearance popover */
.appear{position:absolute;right:44px;top:62px;width:340px;z-index:50;border-radius:20px;padding:14px 16px 16px;
  background:rgba(250,251,255,.9);backdrop-filter:blur(40px) saturate(1.8);border:.5px solid rgba(255,255,255,.9);
  box-shadow:0 30px 70px rgba(10,12,40,.35),0 8px 20px rgba(10,12,40,.18),inset 0 1px 0 #fff}
.appear:before{content:"";position:absolute;right:22px;top:-7px;width:14px;height:14px;transform:rotate(45deg);background:rgba(255,255,255,.8);border-left:.5px solid rgba(255,255,255,.9);border-top:.5px solid rgba(255,255,255,.9)}
.appear h4{font-size:13px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.appear .lbl{font-size:11.5px;color:var(--sec);font-weight:600;margin:12px 0 6px;display:flex;justify-content:space-between}
.appear .lbl b{color:var(--text);font-variant-numeric:tabular-nums}
.mat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mat div{border-radius:12px;padding:6px 6px 7px;text-align:center;font-size:11.5px;font-weight:500;background:rgba(255,255,255,.5);box-shadow:var(--lift1),var(--hl)}
.mat div.on{box-shadow:0 0 0 2px var(--accent),var(--lift1),var(--hl)}
.mat .sw{height:40px;border-radius:8px;margin-bottom:5px;position:relative;overflow:hidden;background:linear-gradient(135deg,#3b58c7,#b04fb0 55%,#f2a45a)}
.mat .sw:after{content:"";position:absolute;inset:6px;border-radius:6px}
.mat .fro .sw:after{background:rgba(255,255,255,.55);backdrop-filter:blur(6px);box-shadow:inset 0 1px 0 #fff}
.mat .glo .sw:after{background:linear-gradient(125deg,rgba(255,255,255,.75),rgba(255,255,255,.12) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.35));box-shadow:inset 0 1px 0 #fff,inset 0 0 0 .5px rgba(255,255,255,.8)}
.mat .sol .sw:after{background:#fff}
.slider{height:22px;position:relative;display:flex;align-items:center}
.slider .tr{height:6px;border-radius:3px;flex:1;background:rgba(25,30,80,.12);box-shadow:inset 0 1px 2px rgba(25,30,80,.2);position:relative}
.slider .fi{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#6fb4ff,#0a6cf0)}
.slider .kn{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);background:linear-gradient(180deg,#fff,#eceff6);box-shadow:0 2px 6px rgba(20,25,70,.35),inset 0 1px 0 #fff,0 0 0 .5px rgba(20,25,70,.15)}
.appear .ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ter);margin-top:2px}
.appear .row2{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;margin-top:12px}
.appear .note{font-size:11px;color:var(--ter);margin-top:12px;line-height:1.4}

/* live token meter: sent / received / current speed */
.meter{margin-left:auto;display:flex;align-items:center;gap:10px;height:28px;padding:0 10px;border-radius:14px;font-size:11.5px;color:var(--sec);font-variant-numeric:tabular-nums;background:var(--fill);position:relative}
.meter+.send{margin-left:6px}
.meter b{color:var(--text);font-weight:600}
.meter .up{color:#0a6cf0}.meter .dn{color:#1f9d45}
.meter .spd{display:flex;align-items:center;gap:6px;padding-left:10px;border-left:.5px solid var(--sep)}
.meter .pulse{width:7px;height:7px;border-radius:50%;background:#1fbf55;box-shadow:0 0 0 3px rgba(31,191,85,.2)}
.glass .meter{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(238,241,249,.9));box-shadow:0 1px 2px rgba(25,30,80,.12),inset 0 1px 0 #fff}

/* ===== dark glass (T51.1): the same material in dark — a dark tint over the same wallpaper, white rims.
   --gfill, --gb and --ghl are the pane tint, rim and top-edge highlight (`glass.*` in color.dark.json).
   Controls (e1) draw no highlight: A109's default `dark_highlight = none`; lifted panes (e2+) keep it. */
.dark.glass{--gfill:var(--c-glass-fill);--gb:var(--c-glass-border);--ghl:var(--c-glass-highlight);
  --win:rgba(31,31,34,.8);--code-bg:rgba(14,15,20,.55);--fill:rgba(255,255,255,.07);--fill2:rgba(255,255,255,.1);
  --sep:rgba(255,255,255,.1);--text:var(--c-text-primary);--sec:var(--c-text-secondary);--ter:var(--c-text-tertiary);
  --glass:rgba(255,255,255,.08);--glass-b:var(--gb);
  --hl:0 0 0 0 transparent;--hl2:inset 0 1px 0 var(--ghl),inset 0 0 0 .5px rgba(255,255,255,.06);
  --lift1:0 1px 2px rgba(0,0,0,.28),0 4px 10px rgba(0,0,0,.18);
  --lift2:0 2px 4px rgba(0,0,0,.26),0 10px 26px rgba(0,0,0,.3);
  --lift3:0 4px 10px rgba(0,0,0,.3),0 24px 60px rgba(0,0,0,.45)}
.dark.glass .window{background:rgba(31,31,34,var(--wa));border:.5px solid var(--gb);
  box-shadow:0 50px 120px rgba(0,0,0,.6),0 16px 40px rgba(0,0,0,.35),inset 0 1px 0 var(--ghl),inset 0 -1px 0 rgba(255,255,255,.05)}
.dark.glass .window:after{opacity:.5}
.dark.glass .sidebar,.dark.glass .insp{background:var(--gfill);border:.5px solid var(--gb);box-shadow:var(--lift2),var(--hl2)}
.dark.glass .col{background:var(--gfill);border:.5px solid var(--gb);box-shadow:inset 0 1px 0 var(--ghl),0 2px 10px rgba(0,0,0,.2)}
.dark.glass .filter{background:rgba(0,0,0,.22);box-shadow:inset 0 1px 2px rgba(0,0,0,.3),0 1px 0 rgba(255,255,255,.06)}
.dark.glass .row.act{background:var(--accent-selected);box-shadow:var(--lift1),inset 0 0 0 .5px var(--gb)}
.dark.glass .row.act .t{color:var(--accent)}
.dark.glass .side-foot{border-top:.5px solid var(--sep)}
.dark.glass .cap,.dark.glass .seg{background:var(--glass);border:.5px solid var(--gb);box-shadow:var(--lift1)}
.dark.glass .seg span.on{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.13));box-shadow:0 1px 3px rgba(0,0,0,.3)}
.dark.glass .cap.hot{background:rgba(59,155,255,.16);color:var(--accent);box-shadow:0 0 0 3px rgba(59,155,255,.22),var(--lift1)}
.dark.glass .stop{background:linear-gradient(180deg,#f7f7fa,#dcdee6);color:#141726;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.dark.glass .tabs{border-bottom:.5px solid var(--sep)}
.dark.glass .tabs span.on,.dark.glass .fr.on{background:rgba(255,255,255,.12);box-shadow:var(--lift1);color:var(--text)}
.dark.glass .user{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.07));box-shadow:var(--lift2),var(--hl2)}
.dark.glass .tool .h{background:rgba(255,255,255,.05);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.dark.glass .tool.exp{background:rgba(31,31,34,.82);border:.5px solid var(--gb);box-shadow:var(--lift2),var(--hl2)}
.dark.glass .tool.exp .h{background:rgba(255,255,255,.05);box-shadow:none}
.dark.glass .tool .ic{background:linear-gradient(180deg,#4a4d5c,#2c2e38);box-shadow:0 1px 2px rgba(0,0,0,.4),0 0 0 .5px rgba(255,255,255,.1);color:#c8cde0}
.dark.glass .tail{background:rgba(8,9,14,.62);border:.5px solid rgba(255,255,255,.1);box-shadow:inset 0 2px 8px rgba(0,0,0,.4)}
.dark.glass .diff .hh{background:rgba(255,255,255,.05)}
.dark.glass .asst code{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}
.dark.glass .composer{background:linear-gradient(180deg,rgba(38,39,44,.88),rgba(31,31,34,.82));border:.5px solid var(--gb);box-shadow:var(--lift3),var(--hl2)}
.dark.glass .chip,.dark.glass .meter{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08);color:var(--sec)}
.dark.glass .meter .up{color:var(--accent)}.dark.glass .meter .dn{color:var(--green)}
.dark.glass .kbd{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);box-shadow:none}
.dark.glass .appear{background:var(--c-surface-popover);border:.5px solid var(--gb);box-shadow:0 30px 70px rgba(0,0,0,.5),0 8px 20px rgba(0,0,0,.3),var(--hl2)}
.dark.glass .appear:before{background:var(--c-surface-popover);border-color:var(--gb)}
.dark.glass .mat>div{background:rgba(255,255,255,.06);box-shadow:var(--lift1)}
.dark.glass .mat>div.on{box-shadow:0 0 0 2px var(--accent),var(--lift1)}
.dark.glass .mat .fro .sw:after{background:rgba(31,31,34,.5);box-shadow:inset 0 1px 0 var(--ghl)}
.dark.glass .mat .glo .sw:after{background:linear-gradient(125deg,rgba(255,255,255,.3),rgba(31,31,34,.2) 40%,rgba(31,31,34,.1) 60%,rgba(255,255,255,.15));box-shadow:inset 0 1px 0 var(--ghl),inset 0 0 0 .5px var(--gb)}
.dark.glass .mat .sol .sw:after{background:var(--c-surface-window)}
.dark.glass .slider .tr{background:rgba(255,255,255,.12);box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.tokpop{position:absolute;right:-6px;bottom:44px;width:360px;z-index:60;border-radius:18px;padding:14px 16px;text-align:left;color:var(--text);

  ${user('Make the provider client respect rate limits properly.',1)}
  ${explored}
  ${asst('<p>429 responses from Anthropic and OpenAI both carry <code>retry-after</code>. Before I change behaviour, one decision is yours:</p>')}
  <div class="appr" style=""><div class="ah"><span style="color:var(--accent)">${I('q',16)}</span> Question from cox</div>
   <div style="padding:2px 20px 10px;font-size:13.5px">When a 429 arrives with <code class="mono">retry-after: 120</code>, which should win?</div>
   <div style="display:flex;flex-direction:column;gap:6px;padding:0 20px 12px">
     <div class="radio on"><span class="o"></span><div>Respect <b>retry-after</b>, even above the 30 s cap<small>Correct per RFC 9110; a turn may pause up to 2 minutes</small></div></div>

  // right, and the toolbar keeps the session's title. The narrower column shows the unified diff.
  const center=`<div style="display:flex;height:100%;margin-top:-6px">
   <div style="width:240px;border-right:.5px solid var(--sep);padding:12px 10px;flex:none">
     <div class="ih" style="padding:0 6px"><span>TURN 1 · 3 FILES</span><span class="plus">+61 <span class="minus">−4</span></span></div>
     <div class="fr on">${I('pencil',13)}<span class="p">retry.rs</span><span class="plus">+18</span><span class="minus">−4</span></div>
     <div class="fr">${I('pencil',13)}<span class="p">Cargo.toml</span><span class="plus">+1</span></div>
     <div class="fr">${I('doc',13)}<span class="p">backoff.rs</span><span class="plus">+42</span></div>
     <div class="ih" style="padding:0 6px;margin-top:16px"><span>COMMENTS · DRAFT</span></div>
     <div class="card" style="font-size:12px"><div style="color:var(--sec);font-size:11px;margin-bottom:4px">retry.rs:45</div>Use <code class="mono">rand::rng()</code> directly in release builds; keep injection for tests only.</div>
     <div class="pb pri" style="justify-content:center">${I('comment',13)} Send 1 comment to agent</div>
   </div>
   <div style="flex:1;min-width:0;padding:12px 16px">
     <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><b style="font-size:14px">crates/cox-provider-http/src/retry.rs</b><span class="plus">+18</span><span class="minus">−4</span></div>
     <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><div class="seg" style="height:28px"><span class="on">Unified</span><span>Split</span></div><span class="spacer"></span><span class="pb">${I('rewind',13)} Revert to before turn 1</span><span class="pb">Open in Zed</span></div>
     <div style="border:.5px solid var(--sep);border-radius:12px;overflow:hidden">
     ${diff([['@','@@ -41,6 +41,9 @@ impl Backoff'],[' ','41','<span class="kw">pub fn</span> <span class="fn">delay</span>(&amp;<span class="kw">self</span>, attempt: <span class="ty">u32</span>) -&gt; <span class="ty">Duration</span> {'],['-','42','    <span class="kw">self</span>.base * <span class="num">2</span><span class="kw">u32</span>.pow(attempt)'],['+','42','    <span class="kw">let</span> ceiling = <span class="kw">self</span>.base.saturating_mul(<span class="num">1</span> &lt;&lt; attempt.min(<span class="num">16</span>));'],['+','43','    <span class="kw">let</span> capped = ceiling.min(<span class="kw">self</span>.cap);'],['+','44','    <span class="com">// full jitter: uniform in [0, capped]</span>'],['+','45','    capped.mul_f64(<span class="kw">self</span>.rng.lock().gen::&lt;<span class="ty">f64</span>&gt;())'],[' ','46','}']])}
     <div style="margin:6px 16px 10px 60px;border:.5px solid var(--accent);border-radius:10px;padding:8px 10px;font-size:12.5px;background:var(--accent-soft)"><b>You</b> · line 45 &nbsp;Use <code class="mono">rand::rng()</code> directly in release builds; keep injection for tests only.</div>
     ${diff([['@','@@ -88,4 +95,6 @@ impl Default for Backoff'],[' ','95','<span class="kw">impl</span> <span class="ty">Default</span> <span class="kw">for</span> <span class="ty">Backoff</span> {'],['-','96','    <span class="kw">fn</span> <span class="fn">default</span>() -&gt; <span class="ty">Self</span> { <span class="ty">Self</span> { base: ms(<span class="num">500</span>) } }'],['+','96','    <span class="kw">fn</span> <span class="fn">default</span>() -&gt; <span class="ty">Self</span> {'],['+','97','        <span class="ty">Self</span> { base: ms(<span class="num">500</span>), cap: secs(<span class="num">30</span>), rng: seeded() }']])}
     </div></div></div>`;
  return shell({center,tb:{running:false},inspTab:'Changes'});
};

function slider(v,a,b){return `<div class="slider"><div class="tr"><div class="fi" style="width:${v}%"></div><div class="kn" style="left:${v}%"></div></div></div><div class="ends"><span>${a}</span><span>${b}</span></div>`}
function glassMain(mat,tok){
  document.body.classList.add('glass'); if(mat==='glossy')document.body.classList.add('glossy');
  const wall=`<div class="wallart">
    <i style="left:-220px;top:-260px;width:980px;height:980px;background:radial-gradient(circle at 40% 40%,#4f7cff,#2b3fb0 55%,transparent 70%)"></i>
    <i style="left:520px;top:-180px;width:820px;height:820px;background:radial-gradient(circle at 50% 50%,#c255c9,#8a3cc0 50%,transparent 70%)"></i>
    <i style="left:980px;top:260px;width:760px;height:760px;background:radial-gradient(circle at 45% 45%,#ff8a5c,#f0508a 50%,transparent 70%)"></i>
    <i style="left:120px;top:520px;width:720px;height:720px;background:radial-gradient(circle at 50% 50%,#2fd2c6,#1c8fb8 50%,transparent 70%)"></i>
    <i style="left:760px;top:600px;width:520px;height:520px;background:radial-gradient(circle,#ffd36b,#ff9f45 45%,transparent 70%)"></i>
    <i style="left:300px;top:140px;width:1100px;height:260px;border-radius:200px;transform:rotate(-14deg);background:linear-gradient(90deg,rgba(255,255,255,.0),rgba(255,255,255,.35),rgba(255,255,255,0))"></i>
    <i style="left:40px;top:660px;width:1300px;height:120px;border-radius:200px;transform:rotate(8deg);background:linear-gradient(90deg,rgba(20,20,60,0),rgba(20,20,60,.35),rgba(20,20,60,0))"></i>
  </div>`;
  const pop=`<div class="appear"><h4>Appearance <span class="kbd">⌘⌥A</span></h4>
    <div class="lbl" style="margin-top:0">MATERIAL</div>
    <div class="mat"><div class="fro ${mat==='frosted'?'on':''}"><div class="sw"></div>Frosted</div><div class="glo ${mat==='glossy'?'on':''}"><div class="sw"></div>Glossy</div><div class="sol"><div class="sw"></div>Solid</div></div>
    <div class="lbl">WINDOW TRANSPARENCY <b>${mat==='glossy'?'70':'58'}%</b></div>${slider(mat==='glossy'?70:58,'Opaque','Clear')}
    <div class="lbl">${mat==='glossy'?'REFLECTION':'FROST (BLUR)'} <b>${mat==='glossy'?'Strong':'34 pt'}</b></div>${slider(mat==='glossy'?78:62,mat==='glossy'?'Matte':'Light',mat==='glossy'?'Mirror':'Heavy')}
    <div class="lbl">DEPTH <b>High</b></div>${slider(80,'Flat','3D')}
    <div class="row2"><span>Tint from wallpaper</span><span class="tog"></span></div>
    <div class="row2"><span>Keep text panels readable</span><span class="tog"></span></div>
    <div class="note">Text blocks stay at least 80% opaque at any setting. Respects System Settings › Accessibility › Reduce transparency.</div></div>`;
  return wall+shell({tb:{appear:tok?'idle':true},center:mainTranscript(),below:composer({meter:{open:tok}}),overlay:tok?'':pop});
}
S['28-main-glass-frosted']=()=>glassMain('frosted');
S['29-main-glass-glossy']=()=>glassMain('glossy');
S['30-main-glass-tokens']=()=>glassMain('frosted',true);
S['31-main-glass-dark-frosted']=()=>{document.body.classList.add('dark');return glassMain('frosted')};
S['32-main-glass-dark-glossy']=()=>{document.body.classList.add('dark');return glassMain('glossy')};

// ---------- render ----------
const key=decodeURIComponent(location.hash.slice(1))||'01-main-session-streaming';
// Only a screen defined above renders, matched by name rather than looked up
// with the hash; an unknown hash falls back to the first.
const found=Object.entries(S).find(([name])=>name===key);
const render=found?found[1]:S['01-main-session-streaming'];
if(key==='__list'){document.getElementById('root').textContent=Object.keys(S).join('\n');}
else{
  document.getElementById('root').innerHTML=render();
  document.querySelectorAll('.scroll:not(.top)').forEach(e=>{e.scrollTop=e.scrollHeight});
}
</script>
