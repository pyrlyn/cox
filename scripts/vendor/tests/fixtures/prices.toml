# Cache pricing: cache_write is 1.25× input_price, cache_read is multiplier × input_price.
# Verified on 2026-09-02 from https://platform.claude.com/docs/pricing
# Type-2 provider rows verified on 2026-09-04 from https://models.dev
# (registry cache ~/.cache/opencode/models.json, opencode 1.18.27) against
# each vendor's pricing page; ids match default.toml [providers.*].models
# exactly so every catalogued model prices its ledger row. OpenAI-compatible
# vendors bill no cache-write surcharge (cache_write = 0); tiered
# context-overage pricing (gpt-5.5/5.6-sol, grok) is recorded at the base tier.

