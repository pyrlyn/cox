name: fix-paging
prompt: |
  The tests in test_paging.py fail. Find and fix the bugs in paging.py
  without changing the tests, then run `python3 -m unittest` and show that
  it passes.
setup: |
  cat > paging.py <<'EOF'
  def paginate(items, page, size):
      """Page `page` (1-based) of `items`, `size` items per page."""
      start = page * size
      return items[start:start + size]


  def page_count(items, size):
      return len(items) // size
  EOF
  cat > test_paging.py <<'EOF'
  import unittest

  from paging import page_count, paginate


  class PagingTest(unittest.TestCase):
      def test_first_page(self):
          self.assertEqual(paginate(list(range(10)), 1, 3), [0, 1, 2])

      def test_last_page_may_be_short(self):
          self.assertEqual(paginate(list(range(10)), 4, 3), [9])

      def test_page_count_rounds_up(self):
          self.assertEqual(page_count(list(range(10)), 3), 4)

      def test_page_count_exact(self):
          self.assertEqual(page_count(list(range(9)), 3), 3)
  EOF
  cksum test_paging.py > .test.sum
check: |
  python3 -m unittest -q &&
  cksum test_paging.py | cmp -s - .test.sum
timeout_s: 300
dry_run:
  turns:
  - text: pages are 1-based and the count rounds up
    calls:
    - tool: write
      input:
        path: paging.py
        content: |
          def paginate(items, page, size):
              """Page `page` (1-based) of `items`, `size` items per page."""
              start = (page - 1) * size
              return items[start:start + size]


          def page_count(items, size):
              return -(-len(items) // size)
    final: fixed both off-by-one bugs
