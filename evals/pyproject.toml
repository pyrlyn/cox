[project]
name = "cox-evals"
version = "0.1.0"
description = "Opt-in eval harness for cox: in-repo tasks and the Terminal-Bench agent"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
    "tomli-w>=1.2.0",
]

[project.scripts]
cox-evals = "cox_evals.harness:main"
cox-bench = "cox_evals.matrix:main"
cox-jev-risk = "cox_evals.jev_risk:main"

[project.optional-dependencies]
tbench = [
    "harbor>=0.23.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
