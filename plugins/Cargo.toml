# The guest workspace (PL§9, T33.27): code that builds for
# `wasm32-unknown-unknown` and runs inside a plugin. A workspace of its own,
# outside the root `members = ["crates/*"]`, so `cargo nextest run
# --workspace` never builds guest code for the host.
[workspace]
resolver = "3"
members = ["sdk", "jev", "cursor", "examples/rust"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pyrlyn/cox"

[workspace.dependencies]
cox-plugin-api = { path = "../crates/cox-plugin-api" }
# The official Rust PDK (PL§13, R§4.3.5 P17): exports, host-function imports
# and extism memory. Default features off: `http` is extism's own HTTP host
# function, which cox never grants (`cox_http` is the one route out), and
# `msgpack` is a codec the JSON-only ABI does not use.
extism-pdk = { version = "1.4.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
# Test-only TOML parser for a plugin's own `plugin.toml` (already in
# toolchain.md/rust.md; cox-plugin-api's own manifest tests use the same
# provider). Never a runtime dependency: PL§2's loader lives in `cox-plugin`.
figment = { version = "0.10", features = ["toml"] }
