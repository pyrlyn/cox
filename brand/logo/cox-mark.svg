<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="cox">
  <!-- Terminal TUI tile: pane chrome + chartreuse cursor (steer/control) -->
  <rect width="64" height="64" rx="12" fill="#0F1A14"/>
  <!-- outer pane frame -->
  <rect x="8" y="8" width="48" height="48" rx="3" fill="none" stroke="#A8E06C" stroke-width="1.75"/>
  <!-- titlebar -->
  <line x1="8" y1="18" x2="56" y2="18" stroke="#6BBF4A" stroke-width="1.25"/>
  <!-- status pip -->
  <circle cx="14" cy="13" r="2" fill="#C8F08A"/>
  <!-- left sidebar / tiller bar -->
  <rect x="11" y="22" width="4" height="28" rx="1" fill="#A8E06C"/>
  <!-- pane divider -->
  <line x1="21" y1="22" x2="21" y2="50" stroke="#344638" stroke-width="1.25"/>
  <!-- mono cursor › (tiller glyph) -->
  <path d="M28 28 L38 34 L28 40" fill="none" stroke="#C8F08A" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- block caret tip -->
  <rect x="40" y="31" width="6" height="6" fill="#A8E06C"/>
</svg>
